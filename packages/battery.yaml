# M5PM1 PMIC (0x6E): battery voltage via VBAT ADC, USB/5V via PWR_SRC, USB IRQ via PY_IRQ.
m5pm1:
  id: m5pm1_pmu
  i2c_id: bus_main
  address: 0x6E
  irq_pin:
    number: GPIO1
    mode:
      input: true
      pullup: true

sensor:
  - platform: m5pm1
    m5pm1_id: m5pm1_pmu
    battery_voltage:
      name: "Paper Mono Battery Voltage"
      id: paper_mono_battery_voltage
    battery_level:
      name: "Paper Mono Battery Level"
      id: paper_mono_battery_level
      on_value:
        - script.execute: paper_mono_battery_ingest_sample

binary_sensor:
  - platform: m5pm1
    m5pm1_id: m5pm1_pmu
    external_power:
      name: "Paper Mono External Power"
      id: paper_mono_external_power
      on_state:
        - script.execute: paper_mono_battery_update_display
        - script.execute: status_led_update

script:
  - id: paper_mono_battery_ingest_sample
    mode: queued
    then:
      - lambda: |-
          if (!id(paper_mono_battery_level).has_state() ||
              std::isnan(id(paper_mono_battery_level).state) ||
              id(paper_mono_battery_level).state < 0.0f ||
              id(paper_mono_battery_level).state > 100.0f)
            return;

          const float raw = id(paper_mono_battery_level).state;
          float *sample = nullptr;
          switch (id(paper_mono_battery_sample_index)) {
            case 0: sample = &id(paper_mono_battery_sample_0); break;
            case 1: sample = &id(paper_mono_battery_sample_1); break;
            default: sample = &id(paper_mono_battery_sample_2); break;
          }
          if (id(paper_mono_battery_sample_count) == 3)
            id(paper_mono_battery_sample_sum) -= *sample;
          else
            id(paper_mono_battery_sample_count)++;
          *sample = raw;
          id(paper_mono_battery_sample_sum) += raw;
          id(paper_mono_battery_sample_index) =
              (id(paper_mono_battery_sample_index) + 1) % 3;
      - script.execute: paper_mono_battery_update_display

  - id: paper_mono_battery_update_display
    mode: queued
    then:
      - lambda: |-
          if (id(paper_mono_battery_sample_count) == 0)
            return;

          const float average = id(paper_mono_battery_sample_sum) /
                                id(paper_mono_battery_sample_count);
          float rounded = floorf(average + 0.5f);
          const bool external_power = id(paper_mono_external_power).has_state() &&
                                      id(paper_mono_external_power).state;
          if (!external_power && !std::isnan(id(paper_mono_battery_display_level)) &&
              rounded > id(paper_mono_battery_display_level))
            rounded = id(paper_mono_battery_display_level);
          id(paper_mono_battery_display_level) = rounded;
      - script.execute: status_led_update

globals:
  # Presentation-only three-sample moving average for the PaperMono battery.
  - id: paper_mono_battery_sample_0
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: paper_mono_battery_sample_1
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: paper_mono_battery_sample_2
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: paper_mono_battery_sample_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: paper_mono_battery_sample_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: paper_mono_battery_sample_sum
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: paper_mono_battery_display_level
    type: float
    restore_value: no
    initial_value: 'NAN'
