# Native ESPHome API. The api.connected condition in the Home Assistant runtime
# package is the authoritative connection signal.
api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-setup"
    password: !secret wifi_password

# HA is the clock authority. It receives timezone and time through the native
# API; unlike the previous literal, it has no synthetic fallback.
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - lambda: 'id(m5pm1_pmu).refresh_power_and_battery();'
          - lambda: |-
              const bool allow_partial = !id(controls_view) && id(ha_connection_state) != 0;
              ESP_LOGI("scheduler", "Scheduler /5: controls=%d ha_state=%d -> partial=%s",
                       id(controls_view), id(ha_connection_state), allow_partial ? "yes" : "no");
          - if:
              condition:
                lambda: 'return !id(controls_view) && id(ha_connection_state) != 0;'
              then:
                - lambda: |-
                    id(epaper_display).update_partial(0, 0, 480, 800);
