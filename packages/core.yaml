esphome:
  name: ${device_name}
  friendly_name: M5Stack PaperMono C153
  on_boot:
    - priority: 300
      then:
        - lambda: |-
            if (id(m5pm1_pmu).is_boot_from_pmic_shutdown()) {
              id(papermono_activity_hub).begin_pmic_wake_hardware_recovery(id(m5ioe1_hub));
            }
    - priority: 200
      then:
        - lambda: |-
            if (id(epaper_display).is_hw_ready_for_refresh()) {
              id(epaper_display).request_refresh(
                  esphome::papermono_epaper::RefreshPolicy::AUTOMATIC,
                  esphome::papermono_epaper::RefreshKind::MANDATORY_FULL,
                  "boot");
            }

logger:
  level: DEBUG

ota:
  - platform: esphome
