# Frontlight activity timeout and BMI270 motion wake for PaperMono.
output:
  - platform: papermono_activity
    id: paper_mono_frontlight_output

light:
  - platform: monochromatic
    output: paper_mono_frontlight_output
    name: Frontlight
    id: paper_mono_frontlight
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    gamma_correct: 1.0

papermono_activity:
  id: papermono_activity_hub
  m5pm1_id: m5pm1_pmu
  rtc_id: papermono_rtc_hub
  display_id: epaper_display
  controls_view: controls_view
  pending_controls_entry: pending_controls_entry
  time_id: ha_time
  ha_connection_state: ha_connection_state
  ha_weather_state: ha_weather_state
  ha_indoor_temperature: ha_indoor_temperature
  ha_indoor_humidity: ha_indoor_humidity
  wifi_transition_pending: wifi_transition_pending
  light_sleep_wake_recovery: light_sleep_wake_recovery
  quiet_hours_sleep_display: quiet_hours_sleep_display
  quiet_hours_user_override: quiet_hours_user_override
  battery_display_level: paper_mono_battery_display_level
  frontlight_default_brightness: frontlight_default_brightness
  frontlight_timeout_seconds: frontlight_timeout_seconds
  sleep_timeout_seconds: sleep_timeout_seconds
  screensaver_refresh_minutes: screensaver_refresh_minutes
  quiet_hours_start: quiet_hours_start
  quiet_hours_end: quiet_hours_end
  frontlight_light: paper_mono_frontlight
  frontlight_output: paper_mono_frontlight_output

papermono_imu:
  id: papermono_imu_hub
  i2c_id: bus_main
  address: 0x68
  m5pm1_id: m5pm1_pmu
  activity_id: papermono_activity_hub
