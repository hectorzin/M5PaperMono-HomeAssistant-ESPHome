esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [papermono_epaper, m5pm1, m5ioe1, papermono_activity, papermono_imu, papermono_rtc, controls]

i2c:
  id: bus_main
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz

m5ioe1:
  id: m5ioe1_hub
  address: 0x4F

papermono_rtc:
  id: papermono_rtc_hub
  i2c_id: bus_main
  address: 0x32

# EPD and touch rails must be enabled before the display/touch drivers initialize.
# epaper_spi enable_pin is declared in YAML schema but not wired in C++ (ESPHome 2026.6.5).
switch:
  - platform: gpio
    id: epd_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 2
      mode:
        output: true

  - platform: gpio
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 12
      mode:
        output: true

spi:
  id: spi_epd
  clk_pin: GPIO15
  mosi_pin: GPIO14

touchscreen:
  - platform: ft63x6
    id: touch_panel
    i2c_id: bus_main
    display: epaper_display
    update_interval: 50ms
    interrupt_pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    reset_pin:
      m5ioe1_id: m5ioe1_hub
      number: 5
      mode:
        output: true
    calibration:
      x_min: 5
      x_max: 475
      y_min: 5
      y_max: 795
    on_touch:
      - lambda: 'id(papermono_activity_hub).report_touch();'
      - lambda: |-
          const int x = touch.x;
          const int y = touch.y;
          if (static_cast<int32_t>(millis() - id(controls_boot_touch_guard_until)) < 0)
            return;
          static const int CARD_X[] = {28, 247};
          static const int CARD_Y[] = {115, 340, 565};
          const int CARD_W = 205;
          const int CARD_H = 210;

          if (!id(controls_view)) {
            id(controls_view) = true;
            id(selected_control) = -1;
            id(controls_climate_mode_selector_open) = false;
            ESP_LOGI("control", "screensaver -> controls");
            id(papermono_activity_hub).enter_controls();
            return;
          }
          if (id(controls_climate_mode_selector_open)) {
            std::vector<std::string> modes;
            std::string token;
            const int popup_slot = id(selected_control) >= 0 ? id(selected_control) : 0;
            const std::string raw = id(controls_id).modes_valid(popup_slot) ? id(controls_id).modes_at(popup_slot) : "";
            auto append_mode = [&](const std::string &candidate) {
              if (candidate != "cool" && candidate != "heat" && candidate != "fan_only" && candidate != "dry" &&
                  candidate != "auto" && candidate != "heat_cool" && candidate != "off") return;
              for (const auto &existing : modes) if (existing == candidate) return;
              modes.push_back(candidate);
            };
            for (size_t i = 0; i <= raw.size(); i++) {
              const char c = i < raw.size() ? raw[i] : '\0';
              if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c == '_')
                token += static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
              else if (!token.empty()) { append_mode(token); token.clear(); }
            }
            const int local_x = x - CARD_X[popup_slot % 2], local_y = y - CARD_Y[popup_slot / 2];
            const int row_h = modes.empty() ? 0 : modes.size() <= 4 ? 40 : modes.size() <= 6 ? 30 : modes.size() <= 7 ? 25 : 20;
            const bool in_popup = !modes.empty() && local_x >= 73 && local_x < 128 &&
                                  local_y >= 165 - static_cast<int>(modes.size()) * row_h && local_y < 165;
            if (in_popup) {
              const int mode_index = (164 - local_y) / row_h;
              if (mode_index >= 0 && static_cast<size_t>(mode_index) < modes.size() &&
                  local_y >= 165 - (mode_index + 1) * row_h && local_y < 165 - mode_index * row_h - 2) {
                std::string current = id(controls_id).state_valid(popup_slot) ? id(controls_id).state_at(popup_slot) : "off";
                for (char &c : current) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
                if (modes[mode_index] != current)
                  id(control_climate_set_hvac_mode).execute(popup_slot, modes[mode_index]);
              }
            }
            id(controls_climate_mode_selector_open) = false;
            id(controls_refresh_partial).execute();
            return;
          }
          if (y < 100) {
            id(controls_view) = false;
            id(selected_control) = -1;
            id(controls_climate_mode_selector_open) = false;
            ESP_LOGI("control", "controls -> screensaver");
            id(papermono_activity_hub).exit_controls();
            return;
          }

          int column = -1;
          if (x >= CARD_X[0] && x < CARD_X[0] + CARD_W) column = 0;
          else if (x >= CARD_X[1] && x < CARD_X[1] + CARD_W) column = 1;
          const int row = y >= CARD_Y[0] && y < CARD_Y[0] + CARD_H ? 0 :
                          y >= CARD_Y[1] && y < CARD_Y[1] + CARD_H ? 1 :
                          y >= CARD_Y[2] && y < CARD_Y[2] + CARD_H ? 2 : -1;
          if (column < 0 || row < 0)
            return;
          const int local_x = x - CARD_X[column];
          const int local_y = y - CARD_Y[row];
          const int slot = row * 2 + column;
          const char *slot_type = id(controls_id).type_at(slot);
          ESP_LOGI("control", "Controls touch: x=%d y=%d slot=%d type=%s rel_x=%d rel_y=%d",
                   x, y, slot, slot_type, local_x, local_y);
          auto light_supports_brightness = [&]() {
            if (!id(controls_id).modes_valid(slot))
              return false;
            const std::string modes = id(controls_id).modes_at(slot);
            if (modes.empty())
              return false;
            static const char *dim_modes[] = {"brightness", "color_temp", "hs", "xy", "rgb", "rgbw", "rgbww", "white"};
            for (const char *mode : dim_modes) {
              if (modes.find(mode) != std::string::npos)
                return true;
            }
            return false;
          };
          // The first row contains the only configured controls in phase 1.
          bool action_detected = false;
          if (std::string(slot_type) == "climate" && local_y >= 160 && local_y < 205) {
            if (local_x < 70) {
              ESP_LOGI("control", "Controls action: slot=1 climate target_down");
              id(control_climate_temperature_down).execute(slot);
              action_detected = true;
            } else if (local_x < 135) {
              ESP_LOGI("control", "Controls action: climate mode_selector_open");
              id(selected_control) = slot;
              id(controls_climate_mode_selector_open) = true;
              id(controls_refresh_partial).execute();
              action_detected = true;
            } else {
              ESP_LOGI("control", "Controls action: slot=1 climate target_up");
              id(control_climate_temperature_up).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "light") {
            if (light_supports_brightness()) {
              const bool light_on = id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on";
              if (!light_on && local_y >= 55 && local_y < 160) {
                ESP_LOGI("control", "Controls action: slot=2 light toggle");
                id(control_light_toggle).execute(slot);
                action_detected = true;
              } else if (light_on && local_y >= 160 && local_y < 205) {
                if (local_x < 70) {
                  ESP_LOGI("control", "Controls action: slot=2 light brightness_down");
                  id(control_light_brightness_down).execute(slot);
                  action_detected = true;
                } else if (local_x < 135) {
                  ESP_LOGI("control", "Controls action: slot=2 light toggle");
                  id(control_light_toggle).execute(slot);
                  action_detected = true;
                } else {
                  ESP_LOGI("control", "Controls action: slot=2 light brightness_up");
                  id(control_light_brightness_up).execute(slot);
                  action_detected = true;
                }
              }
            } else if (local_y >= 55 && local_y < 205) {
              ESP_LOGI("control", "Controls action: slot=2 light toggle");
              id(control_light_toggle).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "cover" && local_y >= 160 && local_y < 205) {
            if (local_x < 70) {
              id(control_cover_open).execute(slot);
              action_detected = true;
            } else if (local_x < 135) {
              id(control_cover_stop).execute(slot);
              action_detected = true;
            } else {
              id(control_cover_close).execute(slot);
              action_detected = true;
            }
          }
          if (!action_detected)
            ESP_LOGI("control", "Controls touch: slot=%d no action", slot);
      - logger.log:
          format: "Touch down x=%d y=%d raw_x=%d raw_y=%d id=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw, touch.id]
    on_release:
      - logger.log:
          format: "Touch released"
