esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [papermono_epaper, m5pm1, m5ioe1, papermono_activity, papermono_imu, papermono_rtc, controls]

i2c:
  id: bus_main
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz

m5ioe1:
  id: m5ioe1_hub
  address: 0x4F

# GPIO42 is the PaperMono's passive buzzer.  Keep the sound short and quiet;
# interaction_feedback is the only code path that drives this output.
output:
  - platform: ledc
    id: interaction_feedback_output
    pin: GPIO42
    frequency: 4000Hz
    zero_means_zero: true

papermono_rtc:
  id: papermono_rtc_hub
  i2c_id: bus_main
  address: 0x32

# EPD and touch rails must be enabled before the display/touch drivers initialize.
# epaper_spi enable_pin is declared in YAML schema but not wired in C++ (ESPHome 2026.6.5).
switch:
  - platform: gpio
    id: epd_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 2
      mode:
        output: true

  - platform: gpio
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 12
      mode:
        output: true

binary_sensor:
  - platform: gpio
    id: physical_button_up
    internal: true
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(controls_view);'
            then:
              - script.execute: controls_page_next
            else:
              - if:
                  condition:
                    lambda: 'return !id(pending_controls_entry);'
                  then:
                    - lambda: |-
                        const size_t total = id(controls_id).count();
                        const int total_pages = total == 0 ? 1 : static_cast<int>((total + 5) / 6);
                        id(papermono_activity_hub).request_controls_entry(0);
                        ESP_LOGI("control", "GPIO2 Controls entry: page=1/%d", total_pages);

  - platform: gpio
    id: physical_button_down
    internal: true
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(controls_view);'
            then:
              - script.execute: controls_page_prev
            else:
              - if:
                  condition:
                    lambda: 'return !id(pending_controls_entry);'
                  then:
                    - lambda: |-
                        const size_t total = id(controls_id).count();
                        const int total_pages = total == 0 ? 1 : static_cast<int>((total + 5) / 6);
                        const int last_page = total_pages - 1;
                        id(papermono_activity_hub).request_controls_entry(last_page);
                        ESP_LOGI("control", "GPIO3 Controls entry: page=%d/%d", total_pages, total_pages);

interval:
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: 'return id(controls_return_home_pending);'
          then:
            - lambda: 'id(controls_return_home_pending) = false;'
            - script.execute: controls_return_home

spi:
  id: spi_epd
  clk_pin: GPIO15
  mosi_pin: GPIO14

touchscreen:
  - platform: ft63x6
    id: touch_panel
    i2c_id: bus_main
    display: epaper_display
    update_interval: 50ms
    interrupt_pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    reset_pin:
      m5ioe1_id: m5ioe1_hub
      number: 5
      mode:
        output: true
    calibration:
      x_min: 5
      x_max: 475
      y_min: 5
      y_max: 795
    on_touch:
      - lambda: 'id(papermono_activity_hub).report_touch();'
      - lambda: |-
          const int x = touch.x;
          const int y = touch.y;
          if (static_cast<int32_t>(millis() - id(controls_boot_touch_guard_until)) < 0)
            return;
          static const int CARD_X[] = {22, 244};
          static const int CARD_Y[] = {64, 308, 552};
          const int CARD_W = 214;
          const int CARD_H = 236;

          if (!id(controls_view)) {
            if (id(pending_controls_entry))
              return;
            id(selected_control) = -1;
            id(controls_id).set_active_slot(-1);
            id(controls_climate_mode_selector_open) = false;
            id(controls_page) = 0;
            id(papermono_activity_hub).enter_controls();
            ESP_LOGI("control", "Controls renderer after enter_controls: view=%s pending=%s renderer=%s",
                     id(controls_view) ? "active" : "inactive", id(pending_controls_entry) ? "pending" : "idle",
                     id(controls_view) ? "controls" : (id(pending_controls_entry) ? "connecting" : "screensaver"));
            return;
          }
          if (y < 60 && x >= 100 && x < 360) {
            ESP_LOGI("control", "Controls back touch");
            id(controls_return_home).execute();
            return;
          }
          if (id(controls_climate_mode_selector_open)) {
            std::vector<std::string> modes;
            std::string token;
            const int popup_slot = id(selected_control) >= 0 ? id(selected_control) : 0;
            const int popup_visual = popup_slot - id(controls_page) * 6;
            if (popup_visual < 0 || popup_visual >= 6)
              return;
            const std::string raw = id(controls_id).modes_valid(popup_slot) ? id(controls_id).modes_at(popup_slot) : "";
            auto append_mode = [&](const std::string &candidate) {
              if (candidate != "cool" && candidate != "heat" && candidate != "fan_only" && candidate != "dry" &&
                  candidate != "auto" && candidate != "heat_cool" && candidate != "off") return;
              for (const auto &existing : modes) if (existing == candidate) return;
              modes.push_back(candidate);
            };
            for (size_t i = 0; i <= raw.size(); i++) {
              const char c = i < raw.size() ? raw[i] : '\0';
              if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c == '_')
                token += static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
              else if (!token.empty()) { append_mode(token); token.clear(); }
            }
            const int local_x = x - CARD_X[popup_visual % 2], local_y = y - CARD_Y[popup_visual / 2];
            const int row_h = modes.empty() ? 0 : modes.size() <= 4 ? 40 : modes.size() <= 6 ? 30 : modes.size() <= 7 ? 25 : 20;
            const bool in_popup = !modes.empty() && local_x >= 79 && local_x < 134 &&
                                  local_y >= 185 - static_cast<int>(modes.size()) * row_h && local_y < 185;
            if (in_popup) {
              const int mode_index = (184 - local_y) / row_h;
              if (mode_index >= 0 && static_cast<size_t>(mode_index) < modes.size() &&
                  local_y >= 185 - (mode_index + 1) * row_h && local_y < 185 - mode_index * row_h - 2) {
                std::string current = id(controls_id).state_valid(popup_slot) ? id(controls_id).state_at(popup_slot) : "off";
                for (char &c : current) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
                if (modes[mode_index] != current) {
                  id(control_climate_set_hvac_mode).execute(popup_slot, modes[mode_index]);
                }
              }
            }
            id(controls_climate_mode_selector_open) = false;
            id(controls_refresh_partial).execute();
            return;
          }
          int column = -1;
          if (x >= CARD_X[0] && x < CARD_X[0] + CARD_W) column = 0;
          else if (x >= CARD_X[1] && x < CARD_X[1] + CARD_W) column = 1;
          const int row = y >= CARD_Y[0] && y < CARD_Y[0] + CARD_H ? 0 :
                          y >= CARD_Y[1] && y < CARD_Y[1] + CARD_H ? 1 :
                          y >= CARD_Y[2] && y < CARD_Y[2] + CARD_H ? 2 : -1;
          if (column < 0 || row < 0)
            return;
          const int local_x = x - CARD_X[column];
          const int local_y = y - CARD_Y[row];
          const int visual_slot = row * 2 + column;
          const int slot = id(controls_page) * 6 + visual_slot;
          if (slot < 0 || static_cast<size_t>(slot) >= id(controls_id).count())
            return;
          id(controls_id).set_active_slot(slot);
          ESP_LOGI("control", "Controls active slot: slot=%d type=%s", slot, id(controls_id).type_at(slot));
          const char *slot_type = id(controls_id).type_at(slot);
          ESP_LOGI("control", "Controls touch: x=%d y=%d slot=%d type=%s rel_x=%d rel_y=%d",
                   x, y, slot, slot_type, local_x, local_y);
          // The first row contains the only configured controls in phase 1.
          bool action_detected = false;
          if (std::string(slot_type) == "climate" && local_y >= 180 && local_y < 225) {
            if (local_x < 69) {
              ESP_LOGI("control", "Controls action: slot=1 climate target_down");
              id(controls_negative).execute(slot);
              action_detected = true;
            } else if (local_x < 138) {
              ESP_LOGI("control", "Controls action: climate mode_selector_open");
              id(selected_control) = slot;
              id(controls_climate_mode_selector_open) = true;
              id(controls_refresh_partial).execute();
              action_detected = true;
            } else {
              ESP_LOGI("control", "Controls action: slot=1 climate target_up");
              id(controls_positive).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "light") {
            if (id(controls_id).light_supports_brightness(slot)) {
              const bool light_on = id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on";
              const bool percentage_tap = local_x >= 60 && local_x < 155 && local_y >= 82 && local_y < 118;
              if (light_on && percentage_tap) {
                const auto previous_mode = id(controls_id).light_edit_mode_at(slot);
                if (id(controls_id).cycle_light_edit_mode(slot)) {
                  const auto next_mode = id(controls_id).light_edit_mode_at(slot);
                  if (previous_mode != esphome::controls::LightEditMode::RGB &&
                      next_mode == esphome::controls::LightEditMode::RGB)
                    id(control_light_color_enter).execute(slot);
                  else if (previous_mode == esphome::controls::LightEditMode::RGB &&
                           next_mode != esphome::controls::LightEditMode::RGB)
                    id(control_light_color_exit).execute(slot);
                  if (previous_mode == esphome::controls::LightEditMode::RGB &&
                      next_mode != esphome::controls::LightEditMode::RGB)
                    if (next_mode == esphome::controls::LightEditMode::COLOR_TEMP) {
                      id(controls_id).cycle_light_edit_mode(slot);
                      id(controls_id).cycle_light_edit_mode(slot);
                    }
                  ESP_LOGI("control", "Controls action: slot=%d light_edit_mode_cycle", slot);
                  action_detected = true;
                }
              } else if (light_on && local_y >= 180 && local_y < 225) {
                if (id(controls_id).color_edit_mode_at(slot)) {
                  if (local_x < 69) id(controls_negative).execute(slot);
                  else if (local_x >= 138) id(controls_positive).execute(slot);
                  action_detected = true;
                } else if (local_x < 69) {
                  ESP_LOGI("control", "Controls action: slot=2 light brightness_down");
                  id(controls_negative).execute(slot);
                  action_detected = true;
            } else if (local_x < 138) {
                  ESP_LOGI("control", "Controls action: slot=2 light toggle");
                  id(control_light_toggle).execute(slot);
                  action_detected = true;
                } else {
                  ESP_LOGI("control", "Controls action: slot=2 light brightness_up");
                  id(controls_positive).execute(slot);
                  action_detected = true;
                }
              } else if (!light_on && local_y >= 55 && local_y < 180) {
                ESP_LOGI("control", "Controls action: slot=2 light toggle");
                id(control_light_toggle).execute(slot);
                action_detected = true;
              }
            } else if (local_y >= 55 && local_y < 180) {
              ESP_LOGI("control", "Controls action: slot=2 light toggle");
              id(control_light_toggle).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "switch" &&
                     local_x >= 56 && local_x < 148 && local_y >= 42 && local_y < 144) {
            std::string state = id(controls_id).state_at(slot);
            for (char &c : state) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
            if (state == "on" || state == "off") {
              ESP_LOGI("control", "Controls action: switch toggle slot=%d", slot);
              id(control_switch_toggle).execute(slot);
            } else {
              ESP_LOGI("control", "Controls action: switch unavailable slot=%d state=%s", slot, state.c_str());
            }
            action_detected = true;
          } else if (std::string(slot_type) == "cover" && local_y >= 180 && local_y < 225) {
            if (local_x < 69) {
              id(controls_positive).execute(slot);
              action_detected = true;
            } else if (local_x < 138) {
              id(control_cover_stop).execute(slot);
              action_detected = true;
            } else {
              id(controls_negative).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "vacuum" && local_y >= 180 && local_y < 225) {
            if (local_x < 69) {
              id(controls_positive).execute(slot);
              action_detected = true;
            } else if (local_x < 138) {
              id(controls_negative).execute(slot);
              action_detected = true;
            } else {
              id(control_vacuum_return_to_base).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "media_player" && local_y >= 130 && local_y < 175) {
            if (local_x < 69) {
              id(control_media_player_volume_down).execute(slot);
              action_detected = true;
            } else if (local_x >= 138) {
              id(control_media_player_volume_up).execute(slot);
              action_detected = true;
            }
          } else if (std::string(slot_type) == "media_player" && local_y >= 180 && local_y < 225) {
            if (local_x < 69) {
              id(control_media_player_previous).execute(slot);
              action_detected = true;
            } else if (local_x < 138) {
              id(control_media_player_play_pause).execute(slot);
              action_detected = true;
            } else {
              id(control_media_player_next).execute(slot);
              action_detected = true;
            }
          }
          if (!action_detected)
            ESP_LOGI("control", "Controls touch: slot=%d no action", slot);
      - logger.log:
          format: "Touch down x=%d y=%d raw_x=%d raw_y=%d id=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw, touch.id]
    on_release:
      - logger.log:
          format: "Touch released"
