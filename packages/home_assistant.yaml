# Home Assistant values are cached locally. DEMO is strictly a global fallback
# after the API has been absent for 60 seconds.
text_sensor:
  - platform: homeassistant
    id: ha_weather_state
    entity_id: ${ha_weather_entity}
    internal: true

sensor:
  - platform: homeassistant
    id: ha_indoor_temperature
    entity_id: ${ha_indoor_temperature_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_humidity
    entity_id: ${ha_indoor_humidity_entity}
    internal: true

  # These are documented standard weather attributes in Home Assistant. They
  # are independently optional: a missing attribute simply has no state.
  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${ha_weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: ${ha_weather_entity}
    attribute: humidity
    internal: true
  - platform: homeassistant
    id: ha_weather_pressure
    entity_id: ${ha_weather_entity}
    attribute: pressure
    internal: true
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${ha_weather_entity}
    attribute: wind_speed
    internal: true

  - platform: homeassistant
    id: ha_outdoor_pm25
    entity_id: ${ha_outdoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_co2
    entity_id: ${ha_indoor_co2_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_pm25
    entity_id: ${ha_indoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_voc
    entity_id: ${ha_indoor_voc_entity}
    internal: true

  - platform: homeassistant
    id: ha_solar_power
    entity_id: ${ha_solar_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_house_power
    entity_id: ${ha_house_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_import
    entity_id: ${ha_grid_import_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_export
    entity_id: ${ha_grid_export_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_charge
    entity_id: ${ha_battery_charge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_discharge
    entity_id: ${ha_battery_discharge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_soc
    entity_id: ${ha_battery_soc_entity}
    internal: true

globals:
  - id: ha_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_last_connected_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_using_demo
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = CONNECTING, 1 = REAL, 2 = DEMO.
  - id: ha_connection_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: ha_connecting_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_connected_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_transition_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: light_sleep_wake_recovery
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_sleep_display
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_user_override
    type: bool
    restore_value: no
    initial_value: 'false'
script:
  - id: controls_refresh_partial
    mode: restart
    then:
      - lambda: |-
          if (id(controls_view) && id(epaper_display).is_idle() &&
              !id(epaper_display).has_refresh_pending()) {
            id(epaper_display).add_partial_region(0, 100, 480, 700);
            id(epaper_display).request_refresh(
                papermono_epaper::RefreshPolicy::USER_INTERACTION,
                papermono_epaper::RefreshKind::NORMAL, "controls_action");
          }
  - id: control_light_toggle
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: light.toggle entity=%s", id(controls_id).entity_id_at(slot));
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_switch_toggle
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: switch.toggle entity=%s", id(controls_id).entity_id_at(slot));
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_light_brightness_down
    parameters:
      slot: int
    then:
      - lambda: |-
          const float value = id(controls_id).number_valid(slot, "brightness")
              ? id(controls_id).number_at(slot, "brightness") : 128.0f;
          ESP_LOGI("control", "HA action: light.turn_on entity=%s brightness=%.0f", id(controls_id).entity_id_at(slot), std::max(0.0f, value - 32.0f));
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          data_template:
            brightness: !lambda |-
              float value = id(controls_id).number_valid(slot, "brightness")
                  ? id(controls_id).number_at(slot, "brightness") : 128.0f;
              return std::max(0.0f, value - 32.0f);
  - id: control_light_brightness_up
    parameters:
      slot: int
    then:
      - lambda: |-
          const float value = id(controls_id).number_valid(slot, "brightness")
              ? id(controls_id).number_at(slot, "brightness") : 128.0f;
          ESP_LOGI("control", "HA action: light.turn_on entity=%s brightness=%.0f", id(controls_id).entity_id_at(slot), std::min(255.0f, value + 32.0f));
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          data_template:
            brightness: !lambda |-
              float value = id(controls_id).number_valid(slot, "brightness")
                  ? id(controls_id).number_at(slot, "brightness") : 128.0f;
              return std::min(255.0f, value + 32.0f);
  - id: control_climate_temperature_down
    parameters:
      slot: int
    then:
      - lambda: |-
          const float value = id(controls_id).number_valid(slot, "target_temperature")
              ? id(controls_id).number_at(slot, "target_temperature") - 0.5f : 20.0f;
          ESP_LOGI("control", "HA action: climate.set_temperature entity=%s temperature=%.1f", id(controls_id).entity_id_at(slot), value);
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          data_template:
            temperature: !lambda |-
              return id(controls_id).number_valid(slot, "target_temperature")
                  ? id(controls_id).number_at(slot, "target_temperature") - 0.5f : 20.0f;
  - id: control_climate_temperature_up
    parameters:
      slot: int
    then:
      - lambda: |-
          const float value = id(controls_id).number_valid(slot, "target_temperature")
              ? id(controls_id).number_at(slot, "target_temperature") + 0.5f : 21.0f;
          ESP_LOGI("control", "HA action: climate.set_temperature entity=%s temperature=%.1f", id(controls_id).entity_id_at(slot), value);
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          data_template:
            temperature: !lambda |-
              return id(controls_id).number_valid(slot, "target_temperature")
                  ? id(controls_id).number_at(slot, "target_temperature") + 0.5f : 21.0f;
  - id: control_climate_set_hvac_mode
    parameters:
      slot: int
      mode: string
    then:
      - lambda: |-
          ESP_LOGI("control", "Controls action: climate set_hvac_mode=%s", mode.c_str());
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          data_template:
            hvac_mode: !lambda 'return mode;'
  - id: control_climate_power_toggle
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: |-
              return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "off";
          then:
            - if:
                condition:
                  lambda: 'return !id(controls_id).last_active_mode_at(slot).empty();'
                then:
                  - lambda: |-
                      ESP_LOGI("control", "HA action: climate.set_hvac_mode entity=%s hvac_mode=%s",
                               id(controls_id).entity_id_at(slot), id(controls_id).last_active_mode_at(slot).c_str());
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                      data_template:
                        hvac_mode: !lambda 'return id(controls_id).last_active_mode_at(slot);'
                else:
                  - lambda: |-
                      ESP_LOGI("control", "HA action: climate.turn_on entity=%s", id(controls_id).entity_id_at(slot));
                  - homeassistant.action:
                      action: climate.turn_on
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - lambda: |-
                ESP_LOGI("control", "HA action: climate.turn_off entity=%s", id(controls_id).entity_id_at(slot));
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_cover_open
    parameters:
      slot: int
    then:
      - homeassistant.action:
          action: cover.open_cover
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_cover_stop
    parameters:
      slot: int
    then:
      - homeassistant.action:
          action: cover.stop_cover
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_cover_close
    parameters:
      slot: int
    then:
      - homeassistant.action:
          action: cover.close_cover
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_vacuum_start
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: vacuum.start entity=%s", id(controls_id).entity_id_at(slot));
      - homeassistant.action:
          action: vacuum.start
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_vacuum_pause
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: vacuum.pause entity=%s", id(controls_id).entity_id_at(slot));
      - homeassistant.action:
          action: vacuum.pause
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
  - id: control_vacuum_return_to_base
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: vacuum.return_to_base entity=%s", id(controls_id).entity_id_at(slot));
      - homeassistant.action:
          action: vacuum.return_to_base
          data:
            entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'

# Control state arrivals request a coalesced PARTIAL only while the controls
# page is visible; the renderer still uses the cached HA states on every draw.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                if (!id(wifi_connected_state)) {
                  id(wifi_connected_state) = true;
                  if (id(ha_connection_state) == 0)
                    id(wifi_transition_pending) = true;
                }
                if (id(wifi_transition_pending) && id(ha_connection_state) == 0 &&
                    id(epaper_display).is_idle() && id(epaper_display).has_baseline()) {
                  id(epaper_display).update_partial(0, 0, 480, 800);
                  id(wifi_transition_pending) = false;
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(wifi_connected_state) && id(ha_connection_state) != 0) {
                  id(wifi_connected_state) = false;
                }
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(ha_last_connected_ms) = millis();
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(ha_connection_state) != 1) {
                  if (id(ha_connecting_since_ms) == 0)
                    id(ha_connecting_since_ms) = millis();
                  else if ((uint32_t) (millis() - id(ha_connecting_since_ms)) >= 1500U) {
                    id(ha_ever_connected) = true;
                    id(ha_using_demo) = false;
                    id(wifi_transition_pending) = false;
                    id(ha_connection_state) = 1;
                    id(ha_connecting_since_ms) = 0;
                    id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                    if (!id(controls_view))
                      id(epaper_display).update();
                  }
                } else {
                  id(ha_ever_connected) = true;
                  id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                id(ha_connecting_since_ms) = 0;
                const bool timeout = id(ha_ever_connected)
                    ? (uint32_t) (millis() - id(ha_last_connected_ms)) > 60000U
                    : millis() > 60000U;
                if (timeout && id(ha_connection_state) != 2) {
                  id(ha_using_demo) = true;
                  id(wifi_transition_pending) = false;
                  id(ha_connection_state) = 2;
                  if (!id(controls_view))
                    id(epaper_display).update();
                }
