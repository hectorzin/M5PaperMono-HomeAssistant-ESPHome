interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                if (!id(wifi_connected_state)) {
                  id(wifi_connected_state) = true;
                  if (id(ha_connection_state) == 0)
                    id(wifi_transition_pending) = true;
                }
                if (id(wifi_transition_pending) && id(ha_connection_state) == 0 &&
                    id(epaper_display).is_idle() && id(epaper_display).has_baseline()) {
                  id(epaper_display).update_partial(0, 0, 480, 800);
                  id(wifi_transition_pending) = false;
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(wifi_connected_state) && id(ha_connection_state) != 0) {
                  id(wifi_connected_state) = false;
                }
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(ha_last_connected_ms) = millis();
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(ha_connection_state) != 1) {
                  if (id(ha_connecting_since_ms) == 0)
                    id(ha_connecting_since_ms) = millis();
                  else if ((uint32_t) (millis() - id(ha_connecting_since_ms)) >= 1500U) {
                    id(ha_ever_connected) = true;
                    id(ha_using_demo) = false;
                    id(wifi_transition_pending) = false;
                    id(ha_connection_state) = 1;
                    id(ha_connecting_since_ms) = 0;
                    id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                    if (!id(controls_view) && !id(pending_controls_entry)) {
                      if (id(epaper_display).has_baseline())
                        id(epaper_display).update_partial(0, 0, 480, 800);
                      else
                        id(epaper_display).update();
                    }
                  }
                } else {
                  id(ha_ever_connected) = true;
                  id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                id(ha_connecting_since_ms) = 0;
                const bool timeout = id(ha_ever_connected)
                    ? (uint32_t) (millis() - id(ha_last_connected_ms)) > 60000U
                    : millis() > 60000U;
                if (timeout && id(ha_connection_state) != 2) {
                  id(ha_using_demo) = true;
                  id(wifi_transition_pending) = false;
                  id(ha_connection_state) = 2;
                  if (!id(controls_view) && !id(pending_controls_entry)) {
                    if (id(epaper_display).has_baseline())
                      id(epaper_display).update_partial(0, 0, 480, 800);
                    else
                      id(epaper_display).update();
                  }
                }
