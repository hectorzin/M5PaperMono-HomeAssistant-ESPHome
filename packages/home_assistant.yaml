# Home Assistant values are cached locally. DEMO is strictly a global fallback
# after the API has been absent for 60 seconds.
text_sensor:
  - platform: homeassistant
    id: ha_weather_state
    entity_id: ${ha_weather_entity}
    internal: true

sensor:
  - platform: homeassistant
    id: ha_indoor_temperature
    entity_id: ${ha_indoor_temperature_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_humidity
    entity_id: ${ha_indoor_humidity_entity}
    internal: true

  # These are documented standard weather attributes in Home Assistant. They
  # are independently optional: a missing attribute simply has no state.
  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${ha_weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: ${ha_weather_entity}
    attribute: humidity
    internal: true
  - platform: homeassistant
    id: ha_weather_pressure
    entity_id: ${ha_weather_entity}
    attribute: pressure
    internal: true
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${ha_weather_entity}
    attribute: wind_speed
    internal: true

  - platform: homeassistant
    id: ha_outdoor_pm25
    entity_id: ${ha_outdoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_co2
    entity_id: ${ha_indoor_co2_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_pm25
    entity_id: ${ha_indoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_voc
    entity_id: ${ha_indoor_voc_entity}
    internal: true

  - platform: homeassistant
    id: ha_solar_power
    entity_id: ${ha_solar_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_house_power
    entity_id: ${ha_house_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_import
    entity_id: ${ha_grid_import_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_export
    entity_id: ${ha_grid_export_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_charge
    entity_id: ${ha_battery_charge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_discharge
    entity_id: ${ha_battery_discharge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_soc
    entity_id: ${ha_battery_soc_entity}
    internal: true

globals:
  - id: ha_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_last_connected_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_using_demo
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = CONNECTING, 1 = REAL, 2 = DEMO.
  - id: ha_connection_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: ha_connecting_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_connected_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_transition_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: light_sleep_wake_recovery
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_sleep_display
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_user_override
    type: bool
    restore_value: no
    initial_value: 'false'
script:
  - id: interaction_feedback
    mode: restart
    then:
      - output.set_level:
          id: interaction_feedback_output
          level: 8%
      - delay: 25ms
      - output.set_level:
          id: interaction_feedback_output
          level: 0%

  - id: ha_controls_action_blocked
    parameters:
      slot: int
    then:
      - lambda: |-
          ESP_LOGI("control", "Controls action blocked: slot=%d type=%s, HA not ready",
                   slot, id(controls_id).type_at(slot));

  - id: controls_refresh_partial
    mode: restart
    then:
      - lambda: |-
          if (id(controls_view) && id(epaper_display).is_idle() &&
              !id(epaper_display).has_refresh_pending()) {
            id(epaper_display).add_partial_region(0, 100, 480, 700);
            id(epaper_display).request_refresh(
                papermono_epaper::RefreshPolicy::USER_INTERACTION,
                papermono_epaper::RefreshKind::NORMAL, "controls_action");
          }
  - id: control_light_toggle
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && (id(controls_id).state_at(slot) == "on" || id(controls_id).state_at(slot) == "off");'
                then:
                  - script.execute: interaction_feedback
            - lambda: |-
                ESP_LOGI("control", "Controls action: slot=%d type=light action=toggle", slot);
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_light_on
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "off";'
                then:
                  - script.execute: interaction_feedback
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_light_off
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on";'
                then:
                  - script.execute: interaction_feedback
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_switch_toggle
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && (id(controls_id).state_at(slot) == "on" || id(controls_id).state_at(slot) == "off");'
                then:
                  - script.execute: interaction_feedback
            - lambda: |-
                ESP_LOGI("control", "HA action: switch.toggle entity=%s", id(controls_id).entity_id_at(slot));
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_switch_on
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "off";'
                then:
                  - script.execute: interaction_feedback
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_switch_off
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on";'
                then:
                  - script.execute: interaction_feedback
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_media_player_previous
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).media_feature_supported(slot, esphome::controls::MEDIA_PLAYER_FEATURE_PREVIOUS_TRACK);'
                then:
                  - script.execute: interaction_feedback
                  - lambda: 'ESP_LOGI("control", "Media player action: slot=%d action=previous", slot);'
                  - homeassistant.action:
                      action: media_player.media_previous_track
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                  - script.execute: controls_refresh_partial
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_media_player_next
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).media_feature_supported(slot, esphome::controls::MEDIA_PLAYER_FEATURE_NEXT_TRACK);'
                then:
                  - script.execute: interaction_feedback
                  - lambda: 'ESP_LOGI("control", "Media player action: slot=%d action=next", slot);'
                  - homeassistant.action:
                      action: media_player.media_next_track
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                  - script.execute: controls_refresh_partial
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_media_player_play_pause
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "playing" && id(controls_id).media_feature_supported(slot, esphome::controls::MEDIA_PLAYER_FEATURE_PAUSE);'
                then:
                  - script.execute: interaction_feedback
                  - lambda: 'ESP_LOGI("control", "Media player action: slot=%d action=pause", slot);'
                  - homeassistant.action:
                      action: media_player.media_pause
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                  - script.execute: controls_refresh_partial
                else:
                  - if:
                      condition:
                        lambda: |-
                          const std::string state = id(controls_id).state_at(slot);
                          return id(controls_id).state_valid(slot) && (state == "paused" || state == "idle" || state == "standby" || state == "off") &&
                                 id(controls_id).media_feature_supported(slot, esphome::controls::MEDIA_PLAYER_FEATURE_PLAY);
                      then:
                        - script.execute: interaction_feedback
                        - lambda: 'ESP_LOGI("control", "Media player action: slot=%d action=play", slot);'
                        - homeassistant.action:
                            action: media_player.media_play
                            data:
                              entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                        - script.execute: controls_refresh_partial
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_media_player_volume
    parameters:
      slot: int
      direction: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).media_feature_supported(slot, esphome::controls::MEDIA_PLAYER_FEATURE_VOLUME_SET) && id(controls_id).media_volume_valid(slot);'
                then:
                  - if:
                      condition:
                        lambda: |-
                          const float old_value = id(controls_id).media_volume_at(slot);
                          const float new_value = std::max(0.0f, std::min(1.0f, old_value + direction * 0.05f));
                          return new_value != old_value;
                      then:
                        - script.execute: interaction_feedback
                  - lambda: |-
                      const float old_value = id(controls_id).media_volume_at(slot);
                      const float new_value = std::max(0.0f, std::min(1.0f, old_value + direction * 0.05f));
                      id(controls_id).set_media_volume_optimistic(slot, new_value);
                      ESP_LOGI("control", "Media player volume optimistic: slot=%d old=%.2f new=%.2f", slot, old_value, new_value);
                  - script.execute: controls_refresh_partial
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                      data_template:
                        volume_level: !lambda |-
                          return id(controls_id).media_volume_at(slot);
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_media_player_volume_up
    parameters:
      slot: int
    then:
      - script.execute:
          id: control_media_player_volume
          slot: !lambda 'return slot;'
          direction: 1
  - id: control_media_player_volume_down
    parameters:
      slot: int
    then:
      - script.execute:
          id: control_media_player_volume
          slot: !lambda 'return slot;'
          direction: -1
  - id: control_light_brightness_down
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: |-
                    const float value = id(controls_id).number_valid(slot, "brightness") ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                    return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on" && std::max(0.0f, value - 32.0f) != value;
                then:
                  - script.execute: interaction_feedback
            - lambda: |-
                const float value = id(controls_id).number_valid(slot, "brightness")
                    ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                ESP_LOGI("control", "HA action: light.turn_on entity=%s brightness=%.0f", id(controls_id).entity_id_at(slot), std::max(0.0f, value - 32.0f));
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                data_template:
                  brightness: !lambda |-
                    float value = id(controls_id).number_valid(slot, "brightness")
                        ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                    return std::max(0.0f, value - 32.0f);
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_light_brightness_up
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: |-
                    const float value = id(controls_id).number_valid(slot, "brightness") ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                    return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on" && std::min(255.0f, value + 32.0f) != value;
                then:
                  - script.execute: interaction_feedback
            - lambda: |-
                const float value = id(controls_id).number_valid(slot, "brightness")
                    ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                ESP_LOGI("control", "HA action: light.turn_on entity=%s brightness=%.0f", id(controls_id).entity_id_at(slot), std::min(255.0f, value + 32.0f));
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                data_template:
                  brightness: !lambda |-
                    float value = id(controls_id).number_valid(slot, "brightness")
                        ? id(controls_id).number_at(slot, "brightness") : 128.0f;
                    return std::min(255.0f, value + 32.0f);
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: color_preview_apply
    parameters:
      slot: int
    then:
      - lambda: |-
          const bool color_valid = id(controls_id).color_valid(slot);
          const int step = id(controls_id).color_step_at(slot);
          const float hue = color_valid ? id(controls_id).hue_at(slot) : 0.0f;
          const float saturation = color_valid ? id(controls_id).saturation_at(slot) : 100.0f;
          const bool white = color_valid && step == 2;
          const float h = std::fmod(hue + 360.0f, 360.0f);
          bool red = color_valid && white, green = color_valid && white, blue = color_valid && white;
          if (color_valid && !white) {
            // The physical LED has six canonical families. For an arbitrary
            // HA hue, preview the nearest canonical family; hue stepping below
            // always lands exactly on one of these six values.
            const int family = (static_cast<int>(std::floor((h + 30.0f) / 60.0f)) % 6 + 6) % 6;
            red = family == 0 || family == 1 || family == 5;
            green = family == 1 || family == 2 || family == 3;
            blue = family == 3 || family == 4 || family == 5;
          }
          id(m5pm1_pmu).set_status_red_led(red);
          if (green) id(status_led_green).turn_on(); else id(status_led_green).turn_off();
          if (blue) id(color_preview_blue).turn_on(); else id(color_preview_blue).turn_off();
          ESP_LOGI("color", "Preview slot=%d hue=%.1f sat=%.1f RGB=%d%d%d", slot, hue, saturation, red, green, blue);
  - id: color_preview_send
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(controls_id).entity_id_at(slot);'
                data_template:
                  hs_color: "{{ [hue, saturation] }}"
                variables:
                  hue: !lambda 'return id(controls_id).color_valid(slot) ? id(controls_id).hue_at(slot) : 0.0f;'
                  saturation: !lambda 'return id(controls_id).color_valid(slot) ? id(controls_id).saturation_at(slot) : 100.0f;'
          else:
            - script.execute:
                id: ha_controls_action_blocked
                slot: !lambda 'return slot;'
  - id: control_light_color_enter
    parameters:
      slot: int
    then:
      - lambda: |-
          const int previous = id(active_color_preview_slot);
          if (previous >= 0 && previous != slot) id(controls_id).set_color_edit_mode(previous, false);
          id(active_color_preview_slot) = slot;
          id(controls_id).set_color_edit_mode(slot, true);
          id(controls_id).set_color_preview_started(slot, false);
      - script.execute:
          id: color_preview_apply
          slot: !lambda 'return slot;'
  - id: control_light_color_exit
    parameters:
      slot: int
    then:
      - lambda: |-
          id(controls_id).set_color_edit_mode(slot, false);
          id(controls_id).set_color_preview_started(slot, false);
          if (id(active_color_preview_slot) == slot) id(active_color_preview_slot) = -1;
          id(color_preview_blue).turn_off();
          // The preview wrote hardware directly; force the normal policy to write
          // both cached channels again on the next status update.
          id(status_led_red_hw_on) = !id(status_led_red_hw_on);
          id(status_led_green_hw_on) = !id(status_led_green_hw_on);
      - script.execute: status_led_update
  - id: controls_page_cleanup
    then:
      - lambda: |-
          id(controls_climate_mode_selector_open) = false;
          id(selected_control) = -1;
          id(controls_id).set_active_slot(-1);
      - if:
          condition:
            lambda: 'return id(active_color_preview_slot) >= 0;'
          then:
            - script.execute:
                id: control_light_color_exit
                slot: !lambda 'return id(active_color_preview_slot);'
          else:
            - lambda: |-
                id(active_color_preview_slot) = -1;
                id(color_preview_blue).turn_off();
            - script.execute: status_led_update
  - id: controls_page_next
    then:
      - lambda: |-
          const size_t total = id(controls_id).count();
          if (total <= 6) return;
          const int old_page = id(controls_page);
          const int total_pages = static_cast<int>((total + 5) / 6);
          id(controls_page) = (old_page + 1) % total_pages;
          ESP_LOGI("control", "Controls page: %d/%d -> %d/%d",
                   old_page + 1, total_pages, id(controls_page) + 1, total_pages);
      - script.execute: controls_page_cleanup
      - lambda: |-
          id(epaper_display).add_partial_region(0, 100, 480, 700);
          id(epaper_display).request_refresh(
              papermono_epaper::RefreshPolicy::USER_INTERACTION,
              papermono_epaper::RefreshKind::NORMAL, "controls_page");
  - id: controls_page_prev
    then:
      - lambda: |-
          const size_t total = id(controls_id).count();
          if (total <= 6) return;
          const int old_page = id(controls_page);
          const int total_pages = static_cast<int>((total + 5) / 6);
          id(controls_page) = (old_page - 1 + total_pages) % total_pages;
          ESP_LOGI("control", "Controls page: %d/%d -> %d/%d",
                   old_page + 1, total_pages, id(controls_page) + 1, total_pages);
      - script.execute: controls_page_cleanup
      - lambda: |-
          id(epaper_display).add_partial_region(0, 100, 480, 700);
          id(epaper_display).request_refresh(
              papermono_epaper::RefreshPolicy::USER_INTERACTION,
              papermono_epaper::RefreshKind::NORMAL, "controls_page");
  - id: controls_return_home
    then:
      - lambda: |-
          id(controls_view) = false;
          id(pending_controls_entry) = false;
          id(selected_control) = -1;
          id(controls_id).set_active_slot(-1);
          id(controls_climate_mode_selector_open) = false;
          id(controls_page) = 0;
          ESP_LOGI("control", "Controls return Home requested");
      - script.execute: controls_exit
      - lambda: 'id(papermono_activity_hub).exit_controls();'
  - id: controls_exit
    then:
      - lambda: 'ESP_LOGI("control", "Controls exit: clearing RGB preview and restoring status LED");'
      - if:
          condition:
            lambda: 'return id(active_color_preview_slot) >= 0;'
          then:
            - script.execute:
                id: control_light_color_exit
                slot: !lambda 'return id(active_color_preview_slot);'
          else:
            - lambda: |-
                id(active_color_preview_slot) = -1;
                id(color_preview_blue).turn_off();
            - script.execute: status_led_update
  - id: control_light_hue_down
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return id(papermono_activity_hub).is_ha_controls_ready();'
          then:
            - if:
                condition:
                  lambda: 'return id(controls_id).state_valid(slot) && id(controls_id).state_at(slot) == "on";'
                then:
                  - script.execute: interaction_feedback
            - lambda: |-
