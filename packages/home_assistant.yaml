# Home Assistant values are cached locally. DEMO is strictly a global fallback
# after the API has been absent for 60 seconds.
text_sensor:
  - platform: homeassistant
    id: ha_control_light_state
    entity_id: ${ha_control_light_entity}
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_state
    entity_id: ${ha_control_climate_entity}
    internal: true
    on_value:
      - lambda: |-
          if (x != "off" && x != "unavailable" && x != "unknown" && !x.empty())
            id(ha_control_climate_last_active_mode) = x;
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_hvac_modes
    entity_id: ${ha_control_climate_entity}
    attribute: hvac_modes
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_friendly_name
    entity_id: ${ha_control_climate_entity}
    attribute: friendly_name
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_light_friendly_name
    entity_id: ${ha_control_light_entity}
    attribute: friendly_name
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_light_supported_color_modes
    entity_id: ${ha_control_light_entity}
    attribute: supported_color_modes
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_weather_state
    entity_id: ${ha_weather_entity}
    internal: true

sensor:
  - platform: homeassistant
    id: ha_control_light_brightness
    entity_id: ${ha_control_light_entity}
    attribute: brightness
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_current_temperature
    entity_id: ${ha_control_climate_entity}
    attribute: current_temperature
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_target_temperature
    entity_id: ${ha_control_climate_entity}
    attribute: temperature
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_min_temperature
    entity_id: ${ha_control_climate_entity}
    attribute: min_temp
    internal: true
    on_value:
      - script.execute: controls_refresh_partial
  - platform: homeassistant
    id: ha_control_climate_max_temperature
    entity_id: ${ha_control_climate_entity}
    attribute: max_temp
    internal: true
    on_value:
      - script.execute: controls_refresh_partial

  - platform: homeassistant
    id: ha_indoor_temperature
    entity_id: ${ha_indoor_temperature_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_humidity
    entity_id: ${ha_indoor_humidity_entity}
    internal: true

  # These are documented standard weather attributes in Home Assistant. They
  # are independently optional: a missing attribute simply has no state.
  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${ha_weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: ${ha_weather_entity}
    attribute: humidity
    internal: true
  - platform: homeassistant
    id: ha_weather_pressure
    entity_id: ${ha_weather_entity}
    attribute: pressure
    internal: true
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${ha_weather_entity}
    attribute: wind_speed
    internal: true

  - platform: homeassistant
    id: ha_outdoor_pm25
    entity_id: ${ha_outdoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_co2
    entity_id: ${ha_indoor_co2_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_pm25
    entity_id: ${ha_indoor_pm25_entity}
    internal: true
  - platform: homeassistant
    id: ha_indoor_voc
    entity_id: ${ha_indoor_voc_entity}
    internal: true

  - platform: homeassistant
    id: ha_solar_power
    entity_id: ${ha_solar_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_house_power
    entity_id: ${ha_house_power_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_import
    entity_id: ${ha_grid_import_entity}
    internal: true
  - platform: homeassistant
    id: ha_grid_export
    entity_id: ${ha_grid_export_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_charge
    entity_id: ${ha_battery_charge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_discharge
    entity_id: ${ha_battery_discharge_entity}
    internal: true
  - platform: homeassistant
    id: ha_battery_soc
    entity_id: ${ha_battery_soc_entity}
    internal: true

globals:
  - id: ha_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_last_connected_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_using_demo
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = CONNECTING, 1 = REAL, 2 = DEMO.
  - id: ha_connection_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: ha_connecting_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_connected_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_transition_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: light_sleep_wake_recovery
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_sleep_display
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: quiet_hours_user_override
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_control_climate_last_active_mode
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  - id: controls_refresh_partial
    mode: restart
    then:
      - lambda: |-
          if (id(controls_view) && id(epaper_display).is_idle() &&
              !id(epaper_display).has_refresh_pending()) {
            id(epaper_display).add_partial_region(0, 100, 480, 700);
            id(epaper_display).request_refresh(
                papermono_epaper::RefreshPolicy::USER_INTERACTION,
                papermono_epaper::RefreshKind::NORMAL, "controls_action");
          }
  - id: control_light_toggle
    then:
      - lambda: |-
          ESP_LOGI("control", "HA action: light.toggle entity=${ha_control_light_entity}");
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${ha_control_light_entity}
  - id: control_light_brightness_down
    then:
      - lambda: |-
          const float value = id(ha_control_light_brightness).has_state()
              ? id(ha_control_light_brightness).state : 128.0f;
          ESP_LOGI("control", "HA action: light.turn_on entity=${ha_control_light_entity} brightness=%.0f", std::max(0.0f, value - 32.0f));
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${ha_control_light_entity}
          data_template:
            brightness: !lambda |-
              float value = id(ha_control_light_brightness).has_state()
                  ? id(ha_control_light_brightness).state : 128.0f;
              return std::max(0.0f, value - 32.0f);
  - id: control_light_brightness_up
    then:
      - lambda: |-
          const float value = id(ha_control_light_brightness).has_state()
              ? id(ha_control_light_brightness).state : 128.0f;
          ESP_LOGI("control", "HA action: light.turn_on entity=${ha_control_light_entity} brightness=%.0f", std::min(255.0f, value + 32.0f));
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${ha_control_light_entity}
          data_template:
            brightness: !lambda |-
              float value = id(ha_control_light_brightness).has_state()
                  ? id(ha_control_light_brightness).state : 128.0f;
              return std::min(255.0f, value + 32.0f);
  - id: control_climate_temperature_down
    then:
      - lambda: |-
          const float value = id(ha_control_climate_target_temperature).has_state()
              ? id(ha_control_climate_target_temperature).state - 0.5f : 20.0f;
          ESP_LOGI("control", "HA action: climate.set_temperature entity=${ha_control_climate_entity} temperature=%.1f", value);
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${ha_control_climate_entity}
          data_template:
            temperature: !lambda |-
              return id(ha_control_climate_target_temperature).has_state()
                  ? id(ha_control_climate_target_temperature).state - 0.5f : 20.0f;
  - id: control_climate_temperature_up
    then:
      - lambda: |-
          const float value = id(ha_control_climate_target_temperature).has_state()
              ? id(ha_control_climate_target_temperature).state + 0.5f : 21.0f;
          ESP_LOGI("control", "HA action: climate.set_temperature entity=${ha_control_climate_entity} temperature=%.1f", value);
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${ha_control_climate_entity}
          data_template:
            temperature: !lambda |-
              return id(ha_control_climate_target_temperature).has_state()
                  ? id(ha_control_climate_target_temperature).state + 0.5f : 21.0f;
  - id: control_climate_set_hvac_mode
    parameters:
      mode: string
    then:
      - lambda: |-
          ESP_LOGI("control", "Controls action: climate set_hvac_mode=%s", mode.c_str());
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${ha_control_climate_entity}
          data_template:
            hvac_mode: !lambda 'return mode;'
  - id: control_climate_power_toggle
    then:
      - if:
          condition:
            lambda: |-
              return id(ha_control_climate_state).has_state() &&
                     id(ha_control_climate_state).state == "off";
          then:
            - if:
                condition:
                  lambda: 'return !id(ha_control_climate_last_active_mode).empty();'
                then:
                  - lambda: |-
                      ESP_LOGI("control", "HA action: climate.set_hvac_mode entity=${ha_control_climate_entity} hvac_mode=%s",
                               id(ha_control_climate_last_active_mode).c_str());
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: ${ha_control_climate_entity}
                      data_template:
                        hvac_mode: !lambda 'return id(ha_control_climate_last_active_mode);'
                else:
                  - lambda: |-
                      ESP_LOGI("control", "HA action: climate.turn_on entity=${ha_control_climate_entity}");
                  - homeassistant.action:
                      action: climate.turn_on
                      data:
                        entity_id: ${ha_control_climate_entity}
          else:
            - lambda: |-
                ESP_LOGI("control", "HA action: climate.turn_off entity=${ha_control_climate_entity}");
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: ${ha_control_climate_entity}

# Control state arrivals request a coalesced PARTIAL only while the controls
# page is visible; the renderer still uses the cached HA states on every draw.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                if (!id(wifi_connected_state)) {
                  id(wifi_connected_state) = true;
                  if (id(ha_connection_state) == 0)
                    id(wifi_transition_pending) = true;
                }
                if (id(wifi_transition_pending) && id(ha_connection_state) == 0 &&
                    id(epaper_display).is_idle() && id(epaper_display).has_baseline()) {
                  id(epaper_display).update_partial(0, 0, 480, 800);
                  id(wifi_transition_pending) = false;
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(wifi_connected_state) && id(ha_connection_state) != 0) {
                  id(wifi_connected_state) = false;
                }
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(ha_last_connected_ms) = millis();
                if (id(light_sleep_wake_recovery))
                  return;
                if (id(ha_connection_state) != 1) {
                  if (id(ha_connecting_since_ms) == 0)
                    id(ha_connecting_since_ms) = millis();
                  else if ((uint32_t) (millis() - id(ha_connecting_since_ms)) >= 1500U) {
                    id(ha_ever_connected) = true;
                    id(ha_using_demo) = false;
                    id(wifi_transition_pending) = false;
                    id(ha_connection_state) = 1;
                    id(ha_connecting_since_ms) = 0;
                    id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                    if (!id(controls_view))
                      id(epaper_display).update();
                  }
                } else {
                  id(ha_ever_connected) = true;
                  id(m5pm1_pmu).log_pmic_wake_recovery_summary_if_needed();
                }
          else:
            - lambda: |-
                if (id(light_sleep_wake_recovery))
                  return;
                id(ha_connecting_since_ms) = 0;
                const bool timeout = id(ha_ever_connected)
                    ? (uint32_t) (millis() - id(ha_last_connected_ms)) > 60000U
                    : millis() > 60000U;
                if (timeout && id(ha_connection_state) != 2) {
                  id(ha_using_demo) = true;
                  id(wifi_transition_pending) = false;
                  id(ha_connection_state) = 2;
                  if (!id(controls_view))
                    id(epaper_display).update();
                }
