# Persistent runtime settings. ESPHome globals restore their values from NVS;
# initial_value is used only when no saved value exists.
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(paper_mono_frontlight_brightness).publish_state(id(frontlight_default_brightness));
            id(paper_mono_frontlight_timeout).publish_state(id(frontlight_timeout_seconds));
            id(paper_mono_refresh_interval).publish_state(str_sprintf("%d", id(screensaver_refresh_minutes)));
            id(paper_mono_quiet_hours_start).publish_state(id(quiet_hours_start));
            id(paper_mono_quiet_hours_end).publish_state(id(quiet_hours_end));
            ESP_LOGI("runtime_config", "Runtime config sync: brightness=%d%% timeout=%us quiet_start=%s quiet_end=%s refresh=%dmin",
                     id(frontlight_default_brightness), id(frontlight_timeout_seconds), id(quiet_hours_start).c_str(),
                     id(quiet_hours_end).c_str(), id(screensaver_refresh_minutes));

globals:
  - id: frontlight_default_brightness
    type: int
    restore_value: yes
    initial_value: '${frontlight_default_brightness}'
  - id: frontlight_timeout_seconds
    type: uint32_t
    restore_value: yes
    initial_value: '${frontlight_timeout_seconds}'
  - id: screensaver_refresh_minutes
    type: int
    restore_value: yes
    initial_value: '${screensaver_refresh_minutes}'
  - id: quiet_hours_start
    type: std::string
    restore_value: yes
    initial_value: '"${quiet_hours_start}"'
  - id: quiet_hours_end
    type: std::string
    restore_value: yes
    initial_value: '"${quiet_hours_end}"'

number:
  - platform: template
    name: Paper Mono Frontlight Brightness
    id: paper_mono_frontlight_brightness
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    set_action:
      - lambda: |-
          const int old_value = id(frontlight_default_brightness);
          id(frontlight_default_brightness) = (int) x;
          ESP_LOGI("runtime_config", "Runtime config HA change: parameter=frontlight_brightness old=%d new=%d stored=%d",
                   old_value, (int) x, id(frontlight_default_brightness));

  - platform: template
    name: Paper Mono Frontlight Timeout
    id: paper_mono_frontlight_timeout
    min_value: 1
    max_value: 3600
    step: 1
    unit_of_measurement: s
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          const uint32_t old_value = id(frontlight_timeout_seconds);
          id(frontlight_timeout_seconds) = (uint32_t) x;
          ESP_LOGI("runtime_config", "Runtime config HA change: parameter=frontlight_timeout old=%u new=%u stored=%u",
                   (unsigned) old_value, (unsigned) x, (unsigned) id(frontlight_timeout_seconds));

text:
  - platform: template
    name: Paper Mono Quiet Hours Start
    id: paper_mono_quiet_hours_start
    mode: text
    min_length: 5
    max_length: 5
    optimistic: true
    on_value:
      - lambda: |-
          ESP_LOGI("runtime_config", "Runtime text callback: parameter=quiet_start received='%s'", x.c_str());
          if (x.size() == 5 && x[2] == ':' && x[0] >= '0' && x[0] <= '2' && x[1] >= '0' && x[1] <= '9' &&
              x[3] >= '0' && x[3] <= '5' && x[4] >= '0' && x[4] <= '9' && ((x[0] < '2') || (x[1] < '4'))) {
            const std::string old_value = id(quiet_hours_start);
            id(quiet_hours_start) = x;
            ESP_LOGI("runtime_config", "Runtime config HA change: parameter=quiet_start old='%s' new='%s' stored='%s'",
                     old_value.c_str(), x.c_str(), id(quiet_hours_start).c_str());
          }
  - platform: template
    name: Paper Mono Quiet Hours End
    id: paper_mono_quiet_hours_end
    mode: text
    min_length: 5
    max_length: 5
    optimistic: true
    on_value:
      - lambda: |-
          ESP_LOGI("runtime_config", "Runtime text callback: parameter=quiet_end received='%s'", x.c_str());
          if (x.size() == 5 && x[2] == ':' && x[0] >= '0' && x[0] <= '2' && x[1] >= '0' && x[1] <= '9' &&
              x[3] >= '0' && x[3] <= '5' && x[4] >= '0' && x[4] <= '9' && ((x[0] < '2') || (x[1] < '4'))) {
            const std::string old_value = id(quiet_hours_end);
            id(quiet_hours_end) = x;
            ESP_LOGI("runtime_config", "Runtime config HA change: parameter=quiet_end old='%s' new='%s' stored='%s'",
                     old_value.c_str(), x.c_str(), id(quiet_hours_end).c_str());
          }

select:
  - platform: template
    name: Paper Mono Refresh Interval
    id: paper_mono_refresh_interval
    options: ["1", "2", "3", "4", "5", "6", "10", "12", "15", "20", "30", "60"]
    optimistic: true
    set_action:
      - lambda: |-
          const int old_value = id(screensaver_refresh_minutes);
          id(screensaver_refresh_minutes) = (int) atoi(x.c_str());
          ESP_LOGI("runtime_config", "Runtime config HA change: parameter=refresh_interval old=%d new=%d stored=%d",
                   old_value, id(screensaver_refresh_minutes), id(screensaver_refresh_minutes));

button:
  - platform: template
    name: Paper Mono Restore Defaults
    id: paper_mono_restore_defaults
    on_press:
      - lambda: |-
          id(frontlight_default_brightness) = ${frontlight_default_brightness};
          id(frontlight_timeout_seconds) = ${frontlight_timeout_seconds};
          id(screensaver_refresh_minutes) = ${screensaver_refresh_minutes};
          id(quiet_hours_start) = "${quiet_hours_start}";
          id(quiet_hours_end) = "${quiet_hours_end}";
          id(paper_mono_frontlight_brightness).publish_state(id(frontlight_default_brightness));
          id(paper_mono_frontlight_timeout).publish_state(id(frontlight_timeout_seconds));
          id(paper_mono_refresh_interval).publish_state(str_sprintf("%d", id(screensaver_refresh_minutes)));
          id(paper_mono_quiet_hours_start).publish_state(id(quiet_hours_start));
          id(paper_mono_quiet_hours_end).publish_state(id(quiet_hours_end));
          ESP_LOGI("runtime_config", "Runtime config: defaults restored brightness=%d%% timeout=%us quiet_start=%s quiet_end=%s refresh=%umin",
                   id(frontlight_default_brightness), (unsigned) id(frontlight_timeout_seconds),
                   id(quiet_hours_start).c_str(), id(quiet_hours_end).c_str(), id(screensaver_refresh_minutes));
