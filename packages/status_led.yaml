# PaperMono status LED: red=M5PM1 PM_LED, green=M5IOE1 GPIO8 (index 7, RMW-safe local m5ioe1).
switch:
  - platform: gpio
    id: status_led_green
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 7
      mode:
        output: true

  - platform: gpio
    id: color_preview_blue
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 8
      mode:
        output: true

output:
  # These outputs are deliberately virtual.  The status_led_update script is
  # still the only code that owns the three physical LED channels.
  - platform: template
    id: status_led_manual_red
    type: float
    write_action:
      - lambda: |-
          id(status_led_manual_red_level) = state;
          id(status_led_manual_override) = true;
          id(status_led_update).execute();
  - platform: template
    id: status_led_manual_green
    type: float
    write_action:
      - lambda: |-
          id(status_led_manual_green_level) = state;
          id(status_led_manual_override) = true;
          id(status_led_update).execute();
  - platform: template
    id: status_led_manual_blue
    type: float
    write_action:
      - lambda: |-
          id(status_led_manual_blue_level) = state;
          id(status_led_manual_override) = true;
          id(status_led_update).execute();

light:
  - platform: rgb
    id: paper_mono_led
    name: "${status_led_name}"
    icon: "mdi:led-on"
    red: status_led_manual_red
    green: status_led_manual_green
    blue: status_led_manual_blue
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - lambda: |-
          id(status_led_manual_override) = false;
          id(status_led_update).execute();
    effects:
      - automation:
          name: "${effect_red}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 100%, green: 0%, blue: 0%}
      - automation:
          name: "${effect_green}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 0%, green: 100%, blue: 0%}
      - automation:
          name: "${effect_blue}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 0%, green: 0%, blue: 100%}
      - automation:
          name: "${effect_yellow}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 100%, green: 100%, blue: 0%}
      - automation:
          name: "${effect_cyan}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 0%, green: 100%, blue: 100%}
      - automation:
          name: "${effect_magenta}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 100%, green: 0%, blue: 100%}
      - automation:
          name: "${effect_white}"
          sequence:
            - light.turn_on: {id: paper_mono_led, effect: None, red: 100%, green: 100%, blue: 100%}

globals:
  - id: status_led_manual_override
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_manual_red_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: status_led_manual_green_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: status_led_manual_blue_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: active_color_preview_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: status_led_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: status_led_logged_mode
    type: int
    restore_value: no
    initial_value: '-1'
  - id: status_led_blink_on
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: status_led_blink_phase_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: status_led_red_hw_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_green_hw_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_blue_hw_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_low_battery_threshold
    type: float
    restore_value: no
    initial_value: '${status_led_low_battery_threshold}'
  - id: status_led_periodic_pulse_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_periodic_red_owned
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_periodic_blue_owned
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_alert_pulse_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_alert_phase
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_alert_last_pulse_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: status_led_alert_red_owned
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_alert_blue_owned
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_sleep_pending
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: status_led_update
    mode: queued
    then:
      - lambda: |-
          static const char *const MODE_NAMES[] = {
              "OFF", "LOW_BATTERY", "EXTERNAL_POWER", "EXTERNAL_POWER_FULL",
              "LOW_BATTERY_ALERT", "HA_ALERT", "LOW_BATTERY_AND_HA_ALERT"};

          const bool external_power = id(paper_mono_external_power).has_state() &&
                                      id(paper_mono_external_power).state;
          const bool display_level_valid =
              !std::isnan(id(paper_mono_battery_display_level)) &&
              id(paper_mono_battery_display_level) >= 0.0f &&
              id(paper_mono_battery_display_level) <= 100.0f;
          const int display_level =
              display_level_valid ? static_cast<int>(id(paper_mono_battery_display_level)) : -1;

          int desired_mode = 0;
          if (external_power) {
            desired_mode = (display_level_valid && display_level >= 100) ? 3 : 2;
          } else {
            const bool low_battery = display_level_valid && display_level < id(status_led_low_battery_threshold);
            // 0 is CONNECTING (including normal/periodic wake recovery), not
            // a confirmed loss. DEMO (2) is entered only after the existing
            // 60 s API absence timeout.
            const bool ha_missing = id(ha_connection_state) == 2;
            if (low_battery || ha_missing) {
              desired_mode = low_battery && ha_missing ? 6 : (low_battery ? 4 : 5);
            }
          }

          if (desired_mode != id(status_led_mode)) {
            id(status_led_mode) = desired_mode;
            id(status_led_blink_on) = true;
            id(status_led_blink_phase_ms) = static_cast<int>(millis());
          }

          if (desired_mode != id(status_led_logged_mode)) {
            ESP_LOGI("status_led", "Status LED: %s", MODE_NAMES[desired_mode]);
            ESP_LOGI("status_led", "Red LED -> M5PM1 PWR_CFG[4] (reg 0x06 bit4 LED_EN)");
            id(status_led_logged_mode) = desired_mode;
          }

          bool red_on = false;
          bool green_on = false;
          bool blue_on = false;

          if (id(notification_alert_active) && !id(status_led_sleep_pending) &&
              !id(light_sleep_wake_recovery)) {
            const uint32_t elapsed =
                static_cast<uint32_t>(millis()) -
                static_cast<uint32_t>(id(notification_alert_blink_phase_ms));
            if (id(notification_alert_blink_on)) {
              green_on = true;
              if (elapsed >= 500) {
                id(notification_alert_blink_on) = false;
                id(notification_alert_blink_phase_ms) = static_cast<int>(millis());
              }
            } else if (elapsed >= 2000) {
              id(notification_alert_blink_on) = true;
              id(notification_alert_blink_phase_ms) = static_cast<int>(millis());
            }
          } else {
          switch (id(status_led_mode)) {
            case 1: {
              const uint32_t elapsed =
                  static_cast<uint32_t>(millis()) -
                  static_cast<uint32_t>(id(status_led_blink_phase_ms));
              if (id(status_led_blink_on)) {
                red_on = true;
                if (elapsed >= 500) {
                  id(status_led_blink_on) = false;
                  id(status_led_blink_phase_ms) = static_cast<int>(millis());
                }
              } else if (elapsed >= 2000) {
                id(status_led_blink_on) = true;
                id(status_led_blink_phase_ms) = static_cast<int>(millis());
              }
              break;
            }
            case 2:
              red_on = true;
              break;
            case 3:
              green_on = true;
              break;
            case 4:
            case 5:
            case 6: {
              // Alert pulses are generated by status_led_alert_pulse below;
              // do not derive their width from the 100 ms scheduler tick.
              break;
            }
            default:
              break;
          }

          // Manual RGB is a logical request only. Quantize it to the nearest
          // one of the seven physical colors; brightness is intentionally
          // ignored because the hardware has no usable PWM path.
          if (id(status_led_manual_override) && !id(notification_alert_active) &&
              !id(status_led_alert_pulse_in_progress) &&
              !id(status_led_periodic_pulse_in_progress)) {
            const float raw_r = id(status_led_manual_red_level);
            const float raw_g = id(status_led_manual_green_level);
            const float raw_b = id(status_led_manual_blue_level);
            const float maximum = std::max(raw_r, std::max(raw_g, raw_b));
            if (maximum > 0.0001f) {
              // RGB outputs may already include brightness. Normalize first so
              // brightness changes do not alter the selected physical color.
              const float r = raw_r / maximum;
              const float g = raw_g / maximum;
              const float b = raw_b / maximum;
              const float scores[7] = {
                  (r - 1) * (r - 1) + g * g + b * b,
                  r * r + (g - 1) * (g - 1) + b * b,
                  r * r + g * g + (b - 1) * (b - 1),
                  (r - 1) * (r - 1) + (g - 1) * (g - 1) + b * b,
                  r * r + (g - 1) * (g - 1) + (b - 1) * (b - 1),
                  (r - 1) * (r - 1) + g * g + (b - 1) * (b - 1),
                  (r - 1) * (r - 1) + (g - 1) * (g - 1) + (b - 1) * (b - 1)};
              int best = 0;
              for (int i = 1; i < 7; i++) if (scores[i] < scores[best]) best = i;
              red_on = best == 0 || best == 3 || best == 5 || best == 6;
              green_on = best == 1 || best == 3 || best == 4 || best == 6;
              blue_on = best == 2 || best == 4 || best == 5 || best == 6;
            } else {
              // All channels can briefly be zero while RGB brightness changes;
              // retain the last physical state instead of selecting a color.
              red_on = id(status_led_red_hw_on);
              green_on = id(status_led_green_hw_on);
              blue_on = id(status_led_blue_hw_on);
            }
          }
          }

          // A color preview owns the physical RGB LED temporarily. Keep computing
          // the normal policy above, but defer all physical status writes.
          // While sleep is pending, leave channels off — do not re-apply status
          // colors after apply_status_led_sleep_pending_ blanked them.
          if (id(active_color_preview_slot) < 0 && !id(status_led_sleep_pending)) {
            if (red_on != id(status_led_red_hw_on)) {
              id(m5pm1_pmu).set_status_red_led(red_on);
              id(status_led_red_hw_on) = red_on;
            }
            if (green_on != id(status_led_green_hw_on)) {
              if (green_on) {
                id(status_led_green).turn_on();
              } else {
                id(status_led_green).turn_off();
              }
              ESP_LOGI("status_led", "Status LED green: %s", green_on ? "ON" : "OFF");
              id(status_led_green_hw_on) = green_on;
            }
            if (blue_on != id(status_led_blue_hw_on)) {
              if (blue_on) id(color_preview_blue).turn_on(); else id(color_preview_blue).turn_off();
              id(status_led_blue_hw_on) = blue_on;
            }
          } else if (id(active_color_preview_slot) >= 0) {
            // Preview owns all RGB channels. Do not leave the status cache
            // claiming ownership of blue when the preview is later released.
            id(status_led_blue_hw_on) = false;
          }
      - if:
          condition:
            lambda: 'return !id(status_led_sleep_pending) && !id(light_sleep_wake_recovery) && !id(status_led_alert_pulse_in_progress) && id(status_led_mode) >= 4 && (uint32_t)(millis() - id(status_led_alert_last_pulse_ms)) >= 1000U;'
          then:
            - script.execute: status_led_alert_pulse

  - id: status_led_alert_pulse
    mode: single
    then:
      - lambda: |-
          if (id(status_led_sleep_pending)) return;
          id(status_led_alert_pulse_in_progress) = true;
          id(status_led_alert_last_pulse_ms) = millis();
          id(status_led_alert_red_owned) = false;
          id(status_led_alert_blue_owned) = false;
          const bool blue = id(status_led_mode) == 5 ||
                            (id(status_led_mode) == 6 && id(status_led_alert_phase));
          id(status_led_alert_phase) = !id(status_led_alert_phase);
          if (id(active_color_preview_slot) < 0) {
            if (blue) {
              id(color_preview_blue).turn_on();
              id(status_led_alert_blue_owned) = true;
            } else {
              id(m5pm1_pmu).set_status_red_led(true);
              id(status_led_alert_red_owned) = true;
            }
          }
      - delay: 40ms
      - lambda: |-
          if (id(active_color_preview_slot) < 0) {
            if (id(status_led_alert_blue_owned)) id(color_preview_blue).turn_off();
            if (id(status_led_alert_red_owned)) id(m5pm1_pmu).set_status_red_led(false);
          }
          id(status_led_alert_red_owned) = false;
          id(status_led_alert_blue_owned) = false;
          id(status_led_alert_pulse_in_progress) = false;

  - id: status_led_periodic_pulse
    mode: single
    then:
      - lambda: |-
          id(status_led_periodic_pulse_in_progress) = true;
          id(status_led_periodic_red_owned) = false;
          id(status_led_periodic_blue_owned) = false;
          const bool periodic_low_battery = !id(paper_mono_external_power).state &&
                                            !std::isnan(id(paper_mono_battery_display_level)) &&
                                            id(paper_mono_battery_display_level) < id(status_led_low_battery_threshold);
          const bool periodic_ha_missing = id(ha_connection_state) == 2;
          const bool blue = periodic_ha_missing &&
                            (!periodic_low_battery || id(status_led_alert_phase));
          if (periodic_low_battery && periodic_ha_missing)
            id(status_led_alert_phase) = !id(status_led_alert_phase);
          if (id(active_color_preview_slot) < 0) {
            if (blue) {
              id(color_preview_blue).turn_on();
              id(status_led_periodic_blue_owned) = true;
            } else {
              id(m5pm1_pmu).set_status_red_led(true);
              id(status_led_periodic_red_owned) = true;
            }
          }
      - delay: 40ms
      - lambda: |-
          // Only release channels this pulse actually acquired. If a preview
          // took ownership meanwhile, leave its hardware state untouched; the
          // preview apply path has already written its complete RGB value.
          if (id(status_led_periodic_blue_owned) && id(active_color_preview_slot) < 0)
            id(color_preview_blue).turn_off();
          if (id(status_led_periodic_red_owned) && id(active_color_preview_slot) < 0)
            id(m5pm1_pmu).set_status_red_led(false);
          id(status_led_periodic_red_owned) = false;
          id(status_led_periodic_blue_owned) = false;
          id(status_led_periodic_pulse_in_progress) = false;

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return !id(status_led_sleep_pending) && (id(status_led_mode) >= 4 || id(notification_alert_active));'
          then:
            - script.execute: status_led_update
