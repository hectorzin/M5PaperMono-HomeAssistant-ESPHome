    type: bool
    restore_value: no
    initial_value: 'false'
  - id: selected_control
    type: int
    restore_value: no
    initial_value: '-1'
  - id: controls_boot_touch_guard_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: controls_climate_mode_selector_open
    type: bool
    restore_value: no
    initial_value: 'false'

# The complete display entry remains here because ESPHome merges display lists,
# not individual display objects; splitting it would be fragile.
display:
  - platform: papermono_epaper
    id: epaper_display
    m5pm1_id: m5pm1_pmu
    spi_id: spi_epd
    update_interval: never
    # 0 = screensaver never auto-FULL from partial_count; explicit policies request FULL.
    full_update_every: 0
    transform:
      mirror_x: true
      mirror_y: false
    rotation: 90
    dimensions:
      width: 800
      height: 480
    cs_pin: GPIO16
    dc_pin: GPIO17
    busy_pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    reset_pin:
      m5ioe1_id: m5ioe1_hub
      number: 4
      mode:
        output: true
    lambda: |-
      const int w = it.get_width();
      const int h = it.get_height();
      it.fill(Color::WHITE);

      if (!id(controls_view)) {
        if (id(ha_connection_state) == 0) {
          it.image(240, 200, id(home_assistant_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          it.printf(240, 370, id(font_connecting), Color::BLACK, TextAlign::TOP_CENTER, "CONECTANDO");
          if (id(wifi_connected_state))
            it.printf(240, 435, id(font_connecting_state), Color::BLACK, TextAlign::TOP_CENTER, "Home Assistant...");
          else
            it.printf(240, 435, id(font_connecting_state), Color::BLACK, TextAlign::TOP_CENTER, "Wi-Fi...");
        } else {
        // DEMO is strictly a global fallback after the API has been absent for
        // 60 seconds. While HA is available, invalid individual fields are
        // rendered as an em dash rather than being presented as demo values.
        const bool use_demo_globally = id(ha_using_demo);
        auto valid = [](float value, float minimum, float maximum) {
          return !std::isnan(value) && value >= minimum && value <= maximum;
        };
        auto available = [&](bool has_state, float value, float minimum, float maximum) {
          return has_state && valid(value, minimum, maximum);
        };
        const bool outdoor_temp_available = available(id(ha_weather_temperature).has_state(), id(ha_weather_temperature).state, -50.0f, 80.0f);
        const bool indoor_temp_available = available(id(ha_indoor_temperature).has_state(), id(ha_indoor_temperature).state, -50.0f, 80.0f);
        const bool humidity_available = available(id(ha_weather_humidity).has_state(), id(ha_weather_humidity).state, 0.0f, 100.0f);
        const bool wind_speed_available = available(id(ha_weather_wind_speed).has_state(), id(ha_weather_wind_speed).state, 0.0f, 500.0f);
        const bool indoor_humidity_available = available(id(ha_indoor_humidity).has_state(), id(ha_indoor_humidity).state, 0.0f, 100.0f);
        const bool co2_available = available(id(ha_indoor_co2).has_state(), id(ha_indoor_co2).state, 0.0f, 10000.0f);
        const bool pm25_indoor_available = available(id(ha_indoor_pm25).has_state(), id(ha_indoor_pm25).state, 0.0f, 2000.0f);
        const bool pm25_outdoor_available = available(id(ha_outdoor_pm25).has_state(), id(ha_outdoor_pm25).state, 0.0f, 2000.0f);
        const bool voc_available = available(id(ha_indoor_voc).has_state(), id(ha_indoor_voc).state, 0.0f, 10000.0f);
        const bool solar_available = available(id(ha_solar_power).has_state(), id(ha_solar_power).state, 0.0f, 100000.0f);
        const bool house_available = available(id(ha_house_power).has_state(), id(ha_house_power).state, 0.0f, 100000.0f);
        const bool grid_import_available = available(id(ha_grid_import).has_state(), id(ha_grid_import).state, 0.0f, 100000.0f);
        const bool grid_export_available = available(id(ha_grid_export).has_state(), id(ha_grid_export).state, 0.0f, 100000.0f);
        const bool battery_charge_available = available(id(ha_battery_charge).has_state(), id(ha_battery_charge).state, 0.0f, 100000.0f);
        const bool battery_discharge_available = available(id(ha_battery_discharge).has_state(), id(ha_battery_discharge).state, 0.0f, 100000.0f);
        const bool battery_soc_available = available(id(ha_battery_soc).has_state(), id(ha_battery_soc).state, 0.0f, 100.0f);
        const bool battery_soc_state_available = id(ha_battery_soc).has_state() && !std::isnan(id(ha_battery_soc).state);

        const std::string &weather_state = id(ha_weather_state).state;
        const bool weather_available = id(ha_weather_state).has_state() && !weather_state.empty() &&
                                       weather_state != "unknown" && weather_state != "unavailable";
        const char *weather = use_demo_globally ? "SOLEADO" : "—";
        if (!use_demo_globally && weather_available) {
          const std::string &state = id(ha_weather_state).state;
          weather = "TIEMPO";
          if (state == "cloudy" || state == "partlycloudy") weather = "NUBLADO";
          else if (state == "rainy" || state == "pouring") weather = "LLUVIA";
          else if (state == "snowy") weather = "NIEVE";
          else if (state == "fog") weather = "NIEBLA";
          else if (state == "windy") weather = "VIENTO";
          else if (state == "sunny" || state == "clear-night") weather = "SOLEADO";
        }
        char outdoor_temp_text[20], indoor_temp_text[20], humidity_text[24], indoor_humidity_text[24], wind_text[28], co2_text[24], pm_indoor_text[28], pm_outdoor_text[28], voc_text[24], weather_detail_text[32];
        char solar_text[20], house_text[20], grid_text[24], battery_text[28], soc_text[20];
        auto power_text = [&](char *buffer, size_t size, bool has_value, float watts) {
          if (!use_demo_globally && !has_value) { strcpy(buffer, "—"); return; }
          if (watts >= 1000.0f) snprintf(buffer, size, "%.1f kW", watts / 1000.0f);
          else snprintf(buffer, size, "%.0f W", watts);
        };
        auto text_or_dash = [&](char *buffer, size_t size, bool has_value, float value, float demo, const char *format) {
          if (!use_demo_globally && !has_value) { strcpy(buffer, "—"); return; }
          snprintf(buffer, size, format, use_demo_globally ? demo : value);
        };
        text_or_dash(outdoor_temp_text, sizeof(outdoor_temp_text), outdoor_temp_available, id(ha_weather_temperature).state, 28.4f, "%.1f C");
        text_or_dash(indoor_temp_text, sizeof(indoor_temp_text), indoor_temp_available, id(ha_indoor_temperature).state, 24.1f, "%.1f C");
        text_or_dash(humidity_text, sizeof(humidity_text), humidity_available, id(ha_weather_humidity).state, 48.0f, "Humedad %.0f %%");
        text_or_dash(wind_text, sizeof(wind_text), wind_speed_available, id(ha_weather_wind_speed).state, 12.0f, "Viento %.0f km/h");
        if (!use_demo_globally && !humidity_available) strcpy(weather_detail_text, "Humedad -");
        else snprintf(weather_detail_text, sizeof(weather_detail_text), "Humedad %.0f %%", use_demo_globally ? 48.0f : id(ha_weather_humidity).state);
        text_or_dash(indoor_humidity_text, sizeof(indoor_humidity_text), indoor_humidity_available, id(ha_indoor_humidity).state, 48.0f, "Humedad %.0f %%");
        text_or_dash(co2_text, sizeof(co2_text), co2_available, id(ha_indoor_co2).state, 612.0f, "CO2 %.0f ppm");
        text_or_dash(pm_indoor_text, sizeof(pm_indoor_text), pm25_indoor_available, id(ha_indoor_pm25).state, 7.0f, "PM2.5 %.0f µg/m³");
        text_or_dash(pm_outdoor_text, sizeof(pm_outdoor_text), pm25_outdoor_available, id(ha_outdoor_pm25).state, 12.0f, "PM2.5 %.0f µg/m³");
        text_or_dash(voc_text, sizeof(voc_text), voc_available, id(ha_indoor_voc).state, 82.0f, "COV %.0f");
        power_text(solar_text, sizeof(solar_text), solar_available, use_demo_globally ? 3200.0f : id(ha_solar_power).state);
        const bool solar_flow_active = use_demo_globally ? true :
                                       (solar_available && id(ha_solar_power).state > 5.0f);
        power_text(house_text, sizeof(house_text), house_available, use_demo_globally ? 1100.0f : id(ha_house_power).state);
        const bool grid_available = grid_import_available || grid_export_available;
        const bool grid_import_flow_active = !use_demo_globally && grid_import_available &&
                                              id(ha_grid_import).state > 5.0f;
        const bool grid_export_flow_active = use_demo_globally ||
                                              (grid_export_available && id(ha_grid_export).state > 5.0f);
        const bool use_grid_import = use_demo_globally ? false : grid_import_available &&
                                     (id(ha_grid_import).state > 0.0f || !grid_export_available);
        power_text(grid_text, sizeof(grid_text), grid_available, use_demo_globally ? 2100.0f : (use_grid_import ? id(ha_grid_import).state : id(ha_grid_export).state));
        const bool battery_available = battery_charge_available || battery_discharge_available;
        const bool battery_charge_flow_active = !use_demo_globally && battery_charge_available &&
                                                 id(ha_battery_charge).state > 5.0f;
        const bool battery_discharge_flow_active = use_demo_globally ||
                                                    (battery_discharge_available && id(ha_battery_discharge).state > 5.0f);
        const bool use_battery_charge = !use_demo_globally && battery_charge_available &&
                                        (id(ha_battery_charge).state > 0.0f || !battery_discharge_available);
        power_text(battery_text, sizeof(battery_text), battery_available, use_demo_globally ? 700.0f : (use_battery_charge ? id(ha_battery_charge).state : id(ha_battery_discharge).state));
        text_or_dash(soc_text, sizeof(soc_text), battery_soc_available, id(ha_battery_soc).state, 76.0f, "%.0f %%");

        auto draw_weather_icon = [&](int x, int y) {
          if (use_demo_globally || weather == std::string("SOLEADO"))
            it.image(x, y, id(weather_sunny_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          else if (weather == std::string("NUBLADO"))
            it.image(x, y, id(weather_cloudy_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          else if (weather == std::string("LLUVIA"))
            it.image(x, y, id(weather_rainy_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          else if (weather == std::string("NIEVE"))
            it.image(x, y, id(weather_snowy_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          else if (weather == std::string("NIEBLA"))
            it.image(x, y, id(weather_fog_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          else if (weather == std::string("VIENTO"))
            it.image(x, y, id(weather_windy_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
        };

        auto draw_device_battery = [&](int x, int y) {
          const bool battery_level_available = !std::isnan(id(paper_mono_battery_display_level)) &&
                                                valid(id(paper_mono_battery_display_level), 0.0f, 100.0f);
          const bool external_power_available = id(paper_mono_external_power).has_state();
          const int body_width = 32;
          const int body_height = 20;
          it.rectangle(x, y, body_width, body_height, Color::BLACK);
          it.filled_rectangle(x + body_width, y + 7, 4, 6, Color::BLACK);

          if (battery_level_available) {
            const float level = id(paper_mono_battery_display_level);
            const int fill_width = static_cast<int>(roundf(level * 26.0f / 100.0f));
            if (fill_width > 0)
              it.filled_rectangle(x + 3, y + 3, fill_width, 14, Color::BLACK);
            it.printf(x + 41, y + 10, id(font_device_battery), Color::BLACK,
                      TextAlign::CENTER_LEFT, "%.0f%%", level);
            it.printf(x + 42, y + 10, id(font_device_battery), Color::BLACK,
                      TextAlign::CENTER_LEFT, "%.0f%%", level);
          } else {
            it.printf(x + 41, y + 10, id(font_device_battery), Color::BLACK,
                      TextAlign::CENTER_LEFT, "%s", "--%");
            it.printf(x + 42, y + 10, id(font_device_battery), Color::BLACK,
                      TextAlign::CENTER_LEFT, "%s", "--%");
          }

          if (external_power_available && id(paper_mono_external_power).state) {
            // Two overlapping filled triangles form a chunky bolt inside the cell.
            it.filled_triangle(x + 20, y + 3, x + 14, y + 10, x + 18, y + 10, Color::BLACK);
            it.filled_triangle(x + 18, y + 9, x + 24, y + 9, x + 15, y + 17, Color::BLACK);
          }
        };

        // Header: the HA time source is intentionally the sole source of truth.
        const auto now = id(ha_time).now();
        if (now.is_valid()) {
          if (id(quiet_hours_sleep_display)) {
            const int header_time_center = 112;
            it.printf(header_time_center, 43, id(font_time), Color::BLACK,
                      TextAlign::TOP_CENTER, "ZZZ");
            it.image(348, 38, id(sleeping_moon_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          } else {
            const int refresh_minutes = id(screensaver_refresh_minutes);
            const int displayed_minute = (now.minute / refresh_minutes) * refresh_minutes;
            it.printf(28, 31, id(font_time), Color::BLACK, "%02d:%02d", now.hour, displayed_minute);
            // ESPHome reports Sunday as 1 through Saturday as 7. Convert to a
            // zero-based Spanish lookup so the device locale is irrelevant.
            static const char *const WEEKDAYS[] = {"DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"};
            static const char *const MONTHS[] = {"ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"};
            const int weekday = (now.day_of_week + 6) % 7;
            const int month = now.month >= 1 && now.month <= 12 ? now.month - 1 : 0;
            char date_text[32];
            snprintf(date_text, sizeof(date_text), "%s %d %s", WEEKDAYS[weekday], now.day_of_month, MONTHS[month]);
            it.print(32, 111, id(font_label), Color::BLACK, date_text);
            draw_weather_icon(348, 38);
          }
        } else {
          it.print(28, 31, id(font_time), Color::BLACK, "--:--");
          it.print(32, 111, id(font_label), Color::BLACK, "---");
          draw_weather_icon(348, 38);
        }
        draw_device_battery(380, 13);
        it.line(28, 143, w - 28, 143, Color::BLACK);

        // Both environments share the same left-hand reading template.
        auto draw_environment_left = [&](const char *title, const char *temperature,
                                         const char *humidity, int y) {
          it.print(32, y, id(font_body), Color::BLACK, title);
          it.print(32, y + 30, id(font_title), Color::BLACK, temperature);
          it.print(32, y + 90, id(font_body), Color::BLACK, humidity);
        };
        draw_environment_left("EXTERIOR", outdoor_temp_text, humidity_text, 161);
        it.printf(350, 191, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", wind_text);
        it.printf(350, 251, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", pm_outdoor_text);

        it.line(28, 313, w - 28, 313, Color::BLACK);
        draw_environment_left("INTERIOR", indoor_temp_text, indoor_humidity_text, 331);
        it.printf(350, 361, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", co2_text);
        it.printf(350, 421, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", pm_indoor_text);

        // Fixed 2x2 energy nodes. Parallel central risers keep grid and
        // battery paths independent without attaching either one to a node.
        it.line(28, 489, w - 28, 489, Color::BLACK);
        const int energy_top_y = 566;
        const int energy_bottom_y = 690;
        const int energy_mid_y = (energy_top_y + energy_bottom_y) / 2;
        const int solar_x = 120;
        const int grid_x = 120;
        const int house_x = 360;
        const int battery_x = 360;
        const int grid_riser_x = 224;
        const int battery_riser_x = 256;
        auto node = [&](int x, int y) { it.circle(x, y, 29, Color::BLACK); };
        auto arrow_right = [&](int x, int y) { it.filled_triangle(x + 8, y, x - 4, y - 6, x - 4, y + 6, Color::BLACK); };
        auto arrow_left = [&](int x, int y) { it.filled_triangle(x - 8, y, x + 4, y - 6, x + 4, y + 6, Color::BLACK); };
        auto arrow_up = [&](int x, int y) { it.filled_triangle(x, y - 8, x - 6, y + 4, x + 6, y + 4, Color::BLACK); };
        auto arrow_down = [&](int x, int y) { it.filled_triangle(x, y + 8, x - 6, y - 4, x + 6, y - 4, Color::BLACK); };
        it.line(solar_x + 27, energy_top_y, house_x - 27, energy_top_y, Color::BLACK);
        it.line(grid_x + 27, energy_bottom_y, grid_riser_x, energy_bottom_y, Color::BLACK);
        it.line(battery_riser_x, energy_bottom_y, battery_x - 27, energy_bottom_y, Color::BLACK);
        it.line(grid_riser_x, energy_top_y, grid_riser_x, energy_bottom_y, Color::BLACK);
        it.line(battery_riser_x, energy_top_y, battery_riser_x, energy_bottom_y, Color::BLACK);
        if (solar_flow_active) arrow_right(180, energy_top_y);  // SOLAR -> bus
        if (grid_import_flow_active) {
          arrow_right(180, energy_bottom_y);                                  // RED -> riser
          arrow_up(grid_riser_x, energy_mid_y);                                // riser -> bus
        } else if (grid_export_flow_active) {
          arrow_down(grid_riser_x, energy_mid_y);                              // bus -> riser
          arrow_left(180, energy_bottom_y);                                    // riser -> RED
        }
        if (use_demo_globally || (house_available && id(ha_house_power).state > 5.0f)) arrow_right(300, energy_top_y); // bus -> CASA
        if (battery_charge_flow_active) {
          arrow_down(battery_riser_x, energy_mid_y);                           // bus -> riser
          arrow_right(300, energy_bottom_y);                                   // riser -> BATERIA
        } else if (battery_discharge_flow_active) {
          arrow_left(300, energy_bottom_y);                                    // BATERIA -> riser
          arrow_up(battery_riser_x, energy_mid_y);                             // riser -> bus
        }
        node(solar_x, energy_top_y); node(grid_x, energy_bottom_y); node(house_x, energy_top_y); node(battery_x, energy_bottom_y);
        it.image(solar_x, energy_top_y, id(energy_solar_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
        it.image(grid_x, energy_bottom_y, id(energy_grid_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
        it.image(house_x, energy_top_y, id(energy_house_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
        auto draw_battery_icon = [&](int x, int y) {
          if (!battery_soc_state_available) {
            it.image(x, y, id(energy_battery_outline_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
            return;
          }
          float battery_soc_clamped = id(ha_battery_soc).state;
          if (battery_soc_clamped < 0.0f) battery_soc_clamped = 0.0f;
          if (battery_soc_clamped > 100.0f) battery_soc_clamped = 100.0f;
          if (battery_soc_clamped < 5.0f)
            it.image(x, y, id(energy_battery_outline_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 15.0f)
            it.image(x, y, id(energy_battery_10_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 25.0f)
            it.image(x, y, id(energy_battery_20_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 35.0f)
            it.image(x, y, id(energy_battery_30_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 45.0f)
            it.image(x, y, id(energy_battery_40_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 55.0f)
            it.image(x, y, id(energy_battery_50_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 65.0f)
            it.image(x, y, id(energy_battery_60_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 75.0f)
            it.image(x, y, id(energy_battery_70_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 85.0f)
            it.image(x, y, id(energy_battery_80_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else if (battery_soc_clamped < 95.0f)
            it.image(x, y, id(energy_battery_90_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          else
            it.image(x, y, id(energy_battery_full_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
        };
        draw_battery_icon(battery_x, energy_bottom_y);
        it.printf(solar_x, energy_top_y + 30, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", solar_text);
        it.printf(grid_x, energy_bottom_y + 30, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", grid_text);
        it.printf(house_x, energy_top_y + 41, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", house_text);
        it.printf(battery_x, energy_bottom_y - 54, id(font_label), Color::BLACK, TextAlign::TOP_CENTER, "%s", soc_text);
        it.printf(battery_x, energy_bottom_y + 30, id(font_body), Color::BLACK, TextAlign::TOP_CENTER, "%s", battery_text);

        if (use_demo_globally)
          it.print(404, 100, id(font_label), Color::BLACK, "DEMO");
        }
      } else {
        // Controls use a reusable 2x3 geometry: six 205x210 cards with
        // 10px gutters. Each card keeps its complete interaction in-cell.
        it.print(28, 30, id(font_title), Color::BLACK, "CONTROLES");
        it.print(350, 48, id(font_label), Color::BLACK, "VOLVER");
        it.line(28, 100, w - 28, 100, Color::BLACK);
        const int card_x[2] = {28, 247};
        const int card_y[3] = {115, 340, 565};
        const int card_w = 205;
        const int card_h = 210;
        auto light_supports_brightness = [&](size_t index) {
          if (!id(controls_id).modes_valid(index))
            return false;
          const std::string modes = id(controls_id).modes_at(index);
          if (modes.empty())
            return false;
          static const char *dim_modes[] = {"brightness", "color_temp", "hs", "xy", "rgb", "rgbw", "rgbww", "white"};
          for (const char *mode : dim_modes) {
            if (modes.find(mode) != std::string::npos)
              return true;
          }
          return false;
        };
        auto draw_arc = [&](int x, int y, float value, bool active) {
          const int cx = x + 102, cy = y + 105, radius = 70, steps = 32;
          const float start = 140.0f, end = 400.0f;
          const float clamped = value < 0.0f ? 0.0f : value > 1.0f ? 1.0f : value;
          auto px = [&](float degrees, int r) { return cx + static_cast<int>(r * std::cos(degrees * 0.0174532925f)); };
          auto py = [&](float degrees, int r) { return cy + static_cast<int>(r * std::sin(degrees * 0.0174532925f)); };
          for (int i = 0; i < steps; i++) {
            const float a0 = start + (end - start) * i / steps, a1 = start + (end - start) * (i + 1) / steps;
            it.line(px(a0, radius), py(a0, radius), px(a1, radius), py(a1, radius), Color::BLACK);
            if (active && (i + 1) <= static_cast<int>(clamped * steps + 0.5f)) {
              it.line(px(a0, radius - 2), py(a0, radius - 2), px(a1, radius - 2), py(a1, radius - 2), Color::BLACK);
              it.line(px(a0, radius + 2), py(a0, radius + 2), px(a1, radius + 2), py(a1, radius + 2), Color::BLACK);
            }
          }
        };
        auto draw_percentage_arc = [&](int x, int y, float value, bool active) {
          const int cx = x + 102, cy = y + 105, radius = 70, steps = 32;
          const float start = 140.0f, end = 400.0f;
          const float clamped = value < 0.0f ? 0.0f : value > 1.0f ? 1.0f : value;
          auto px = [&](float degrees, int r) { return cx + static_cast<int>(r * std::cos(degrees * 0.0174532925f)); };
          auto py = [&](float degrees, int r) { return cy + static_cast<int>(r * std::sin(degrees * 0.0174532925f)); };
          for (int i = 0; i < steps; i++) {
            const float a0 = start + (end - start) * i / steps, a1 = start + (end - start) * (i + 1) / steps;
            it.line(px(a0, radius), py(a0, radius), px(a1, radius), py(a1, radius), Color::BLACK);
            if (active && (i + 1) <= static_cast<int>(clamped * steps + 0.5f)) {
              it.line(px(a0, radius - 2), py(a0, radius - 2), px(a1, radius - 2), py(a1, radius - 2), Color::BLACK);
              it.line(px(a0, radius + 2), py(a0, radius + 2), px(a1, radius + 2), py(a1, radius + 2), Color::BLACK);
            }
          }
        };
        auto draw_arc_marker = [&](int x, int y, float value, bool double_notch) {
          const int cx = x + 102, cy = y + 105, radius = 70;
          const float fraction = value < 0.0f ? 0.0f : value > 1.0f ? 1.0f : value;
          const float angle = (140.0f + 260.0f * fraction) * 0.0174532925f;
          auto marker = [&](float offset) {
            const float a = angle + offset;
            it.line(cx + static_cast<int>((radius - 5) * std::cos(a)), cy + static_cast<int>((radius - 5) * std::sin(a)),
                    cx + static_cast<int>((radius + 5) * std::cos(a)), cy + static_cast<int>((radius + 5) * std::sin(a)), Color::BLACK);
          };
          marker(0.0f);
          if (double_notch) { marker(-0.045f); marker(0.045f); }
        };
        auto split_hvac_modes = [&](const std::string &raw) {
          std::vector<std::string> modes;
          std::string token;
          auto append_mode = [&](const std::string &candidate) {
            if (candidate != "cool" && candidate != "heat" && candidate != "fan_only" && candidate != "dry" &&
                candidate != "auto" && candidate != "heat_cool" && candidate != "off") return;
            for (const auto &existing : modes) if (existing == candidate) return;
            modes.push_back(candidate);
          };
          for (size_t i = 0; i <= raw.size(); i++) {
            const char c = i < raw.size() ? raw[i] : '\0';
            if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c == '_')
              token += static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
            else if (!token.empty()) { append_mode(token); token.clear(); }
          }
          return modes;
        };
        auto hvac_icon = [&](const std::string &mode) -> esphome::image::Image * {
          if (mode == "cool") return id(control_hvac_cool_icon);
          if (mode == "heat") return id(control_hvac_heat_icon);
          if (mode == "fan_only") return id(control_hvac_fan_icon);
          if (mode == "dry") return id(control_hvac_dry_icon);
          if (mode == "auto" || mode == "heat_cool") return id(control_hvac_auto_icon);
          return id(control_power_icon);
        };
        auto card = [&](int x, int y) { it.rectangle(x, y, card_w, card_h, Color::BLACK); };
        auto button = [&](int x, int y, const char *label) {
          it.rectangle(x, y, 55, 40, Color::BLACK);
          it.printf(x + 28, y + 4, id(font_subtitle), Color::BLACK, TextAlign::TOP_CENTER, "%s", label);
        };
        auto button_icon = [&](int x, int y, esphome::image::Image *icon) {
          it.rectangle(x, y, 55, 40, Color::BLACK);
          it.image(x + 28, y + 20, icon, ImageAlign::CENTER, Color::BLACK, Color::WHITE);
        };
        auto draw_empty = [&](int x, int y) {
          card(x, y);
        };
        auto draw_climate = [&](size_t index, int x, int y) {
          card(x, y);
          const std::string climate_name = id(controls_id).resolved_name_at(index);
          it.printf(x + 102, y + 12, id(font_control_name), Color::BLACK, TextAlign::TOP_CENTER, "%s", climate_name.c_str());
          std::string current_mode = id(controls_id).state_valid(index) ? id(controls_id).state_at(index) : "off";
          for (char &c : current_mode) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
          const bool target_valid = id(controls_id).number_valid(index, "target_temperature");
          const float target = target_valid ? id(controls_id).number_at(index, "target_temperature") : 21.0f;
          const bool current_valid = id(controls_id).number_valid(index, "current_temperature");
          const float current = current_valid ? id(controls_id).number_at(index, "current_temperature") : 21.0f;
          const float climate_min = id(controls_id).number_valid(index, "min_temperature") ? id(controls_id).number_at(index, "min_temperature") : 17.0f;
          const float climate_max = id(controls_id).number_valid(index, "max_temperature") ? id(controls_id).number_at(index, "max_temperature") : 26.0f;
          const float range = climate_max > climate_min ? climate_max - climate_min : 9.0f;
          draw_arc(x, y, (target - climate_min) / range, target_valid && current_mode != "off");
          if (target_valid) draw_arc_marker(x, y, (target - climate_min) / range, false);
          if (current_valid) draw_arc_marker(x, y, (current - climate_min) / range, true);
          if (target_valid)
            it.printf(x + 102, y + 65, id(font_title), Color::BLACK, TextAlign::TOP_CENTER, "%.1f°", target);
          else
            it.print(x + 102, y + 65, id(font_title), Color::BLACK, TextAlign::TOP_CENTER, "--°");
          const int current_row_y = y + 123;
          it.image(x + 74, current_row_y, id(control_thermometer_icon), ImageAlign::TOP_CENTER, Color::BLACK, Color::WHITE);
          if (current_valid)
            it.printf(x + 112, current_row_y + 1, id(font_connecting_state), Color::BLACK, TextAlign::TOP_CENTER, "%.1f°", current);
          else
            it.print(x + 112, current_row_y + 1, id(font_connecting_state), Color::BLACK, TextAlign::TOP_CENTER, "--°");
          button(x + 10, y + 165, "-");
          button_icon(x + 75, y + 165, hvac_icon(current_mode));
          button(x + 140, y + 165, "+");
          if (id(controls_climate_mode_selector_open)) {
            const auto modes = split_hvac_modes(id(controls_id).modes_valid(index) ? id(controls_id).modes_at(index) : "");
            const int row_h = modes.size() <= 4 ? 40 : modes.size() <= 6 ? 30 : modes.size() <= 7 ? 25 : 20;
            for (size_t i = 0; i < modes.size(); i++) {
              const int cell_y = y + 165 - (static_cast<int>(i) + 1) * row_h;
              const bool selected = modes[i] == current_mode;
              if (selected) it.filled_rectangle(x + 73, cell_y, 55, row_h - 2, Color::BLACK);
              else { it.filled_rectangle(x + 73, cell_y, 55, row_h - 2, Color::WHITE); it.rectangle(x + 73, cell_y, 55, row_h - 2, Color::BLACK); }
              it.image(x + 102, cell_y + row_h / 2, hvac_icon(modes[i]), ImageAlign::CENTER,
                       selected ? Color::WHITE : Color::BLACK, selected ? Color::BLACK : Color::WHITE);
            }
          }
        };
        auto draw_light = [&](size_t index, int x, int y) {
          card(x, y);
          const std::string light_name = id(controls_id).resolved_name_at(index);
          it.printf(x + 102, y + 12, id(font_control_name), Color::BLACK, TextAlign::TOP_CENTER, "%s", light_name.c_str());
          const bool on = id(controls_id).state_valid(index) && id(controls_id).state_at(index) == "on";
          const bool dimmable = light_supports_brightness(index);
          if (dimmable) {
            const bool brightness_valid = id(controls_id).number_valid(index, "brightness") && id(controls_id).number_at(index, "brightness") >= 0.0f && id(controls_id).number_at(index, "brightness") <= 255.0f;
            const float brightness = brightness_valid ? id(controls_id).number_at(index, "brightness") / 255.0f : 0.0f;
            if (on) {
              draw_percentage_arc(x, y, brightness, brightness_valid);
              if (brightness_valid) it.printf(x + 102, y + 82, id(font_title), Color::BLACK, TextAlign::TOP_CENTER, "%.0f%%", brightness * 100.0f);
              button(x + 10, y + 165, "-"); button_icon(x + 75, y + 165, id(control_light_icon)); button(x + 140, y + 165, "+");
            } else {
              it.image(x + 102, y + 105, id(control_light_outline_large_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
            }
          } else {
            it.image(x + 102, y + 105, on ? id(control_light_large_icon) : id(control_light_outline_large_icon),
                     ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          }
        };
        auto draw_cover = [&](size_t index, int x, int y) {
          card(x, y);
          const std::string cover_name = id(controls_id).resolved_name_at(index);
          it.printf(x + 102, y + 12, id(font_control_name), Color::BLACK, TextAlign::TOP_CENTER, "%s", cover_name.c_str());
          const bool position_valid = id(controls_id).number_valid(index, "current_position") &&
                                      id(controls_id).number_at(index, "current_position") >= 0.0f &&
                                      id(controls_id).number_at(index, "current_position") <= 100.0f;
          const float position = position_valid ? id(controls_id).number_at(index, "current_position") : 0.0f;
          draw_percentage_arc(x, y, position / 100.0f, position_valid);
          if (position_valid)
            it.printf(x + 102, y + 75, id(font_title), Color::BLACK, TextAlign::TOP_CENTER, "%.0f%%", position);
          else
            it.print(x + 102, y + 75, id(font_title), Color::BLACK, TextAlign::TOP_CENTER, "--%");
          button_icon(x + 10, y + 165, id(control_cover_open_icon));
          button_icon(x + 75, y + 165, id(control_cover_stop_icon));
          button_icon(x + 140, y + 165, id(control_cover_close_icon));
        };
        auto draw_vacuum = [&](size_t index, int x, int y) {
          card(x, y);
          const std::string vacuum_name = id(controls_id).resolved_name_at(index);
          it.printf(x + 102, y + 12, id(font_control_name), Color::BLACK, TextAlign::TOP_CENTER, "%s", vacuum_name.c_str());
          std::string state = id(controls_id).state_at(index);
          if (state.empty()) state = "unknown";
          for (char &c : state) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
          const char *status = "Desconocido";
          if (state == "cleaning") status = "Limpiando";
          else if (state == "docked") status = "En base";
          else if (state == "paused") status = "Pausado";
          else if (state == "idle") status = "Listo";
          else if (state == "returning") status = "Volviendo";
          else if (state == "error") status = "Error";
          else if (state == "unavailable") status = "No disponible";
          it.image(x + 102, y + 91, id(control_vacuum_icon), ImageAlign::CENTER, Color::BLACK, Color::WHITE);
          it.printf(x + 102, y + 137, id(font_connecting_state), Color::BLACK, TextAlign::TOP_CENTER, "%s", status);
          button_icon(x + 10, y + 165, id(control_vacuum_start_icon));
          button_icon(x + 75, y + 165, id(control_vacuum_pause_icon));
          button_icon(x + 140, y + 165, id(control_vacuum_return_to_base_icon));
        };
        for (size_t index = 0; index < 6; index++) {
          const int x = card_x[index % 2];
          const int y = card_y[index / 2];
          const std::string type = id(controls_id).type_at(index);
          if (type == "climate") draw_climate(index, x, y);
          else if (type == "light") draw_light(index, x, y);
          else if (type == "cover") draw_cover(index, x, y);
          else if (type == "vacuum") draw_vacuum(index, x, y);
          else draw_empty(x, y);
        }
      }
