# These are the same compact Material Design weather pictograms used by the
# reference e-paper dashboard. ESPHome embeds them at build time, so they stay
# monochrome and do not add a runtime dependency.
# Keep the initial page deterministic and ignore the FT6336G startup edge
# that can otherwise be reported as a touch before the panel is settled.
esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            id(controls_view) = false;
            id(selected_control) = -1;
            id(controls_boot_touch_guard_until) = millis() + 3000U;

