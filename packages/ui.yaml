font:
  - file: "fonts/DejaVuSans.ttf"
    id: font_time
    size: 72
  - file: "fonts/DejaVuSans.ttf"
    id: font_body
    size: 24
    glyphsets:
      - GF_Latin_Core
    glyphs: ["µ³"]
  - file: "fonts/DejaVuSans.ttf"
    id: font_title
    size: 48
  - file: "fonts/DejaVuSans.ttf"
    id: font_connecting
    size: 32
  - file: "fonts/DejaVuSans.ttf"
    id: font_connecting_state
    size: 24
  - file: "fonts/DejaVuSans.ttf"
    id: font_subtitle
    size: 28
  - file: "fonts/DejaVuSans.ttf"
    id: font_label
    size: 18
  - file: "fonts/DejaVuSans.ttf"
    id: font_device_battery
    size: 20

