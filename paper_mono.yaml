# Firmware entry point. User-specific Home Assistant entity IDs stay in
# config/home_assistant.yaml; the packages below compose the stable firmware.
substitutions:
  device_name: paper-mono

packages:
  core: !include packages/core.yaml
  connectivity: !include packages/connectivity.yaml
  hardware: !include packages/hardware.yaml
  battery: !include packages/battery.yaml
  status_led: !include packages/status_led.yaml
  frontlight: !include packages/frontlight.yaml
  home_assistant_entities: !include config/home_assistant.yaml
  home_assistant_runtime: !include packages/home_assistant.yaml
  ui: !include packages/ui.yaml
