substitutions:
  device_name: paper-mono

esphome:
  name: ${device_name}
  friendly_name: M5Stack PaperMono C153
  on_boot:
    - priority: 200
      then:
        - component.update: epaper_display

packages:
  home_assistant: !include config/home_assistant.yaml

esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://m5stack/esphome-yaml/components@main
    components: [m5ioe1]
  - source:
      type: local
      path: components
    components: [papermono_epaper]

logger:
  level: DEBUG

ota:
  - platform: esphome

# Native ESPHome API.  The api.connected condition below is the authoritative
# connection signal; HA sensor updates only update their local component state.
api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-setup"
    password: !secret wifi_password

i2c:
  id: bus_main
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz

m5ioe1:
  id: m5ioe1_hub
  address: 0x4F

# EPD and touch rails must be enabled before the display/touch drivers initialize.
# epaper_spi enable_pin is declared in YAML schema but not wired in C++ (ESPHome 2026.6.5).
switch:
  - platform: gpio
    id: epd_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 2
      mode:
        output: true

  - platform: gpio
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 12
      mode:
        output: true

spi:
  id: spi_epd
  clk_pin: GPIO15
  mosi_pin: GPIO14

font:
  - file: "fonts/DejaVuSans.ttf"
    id: font_time
    size: 72
  - file: "fonts/DejaVuSans.ttf"
    id: font_body
    size: 24
  - file: "fonts/DejaVuSans.ttf"
    id: font_title
    size: 48
  - file: "fonts/DejaVuSans.ttf"
    id: font_subtitle
    size: 28

globals:
  - id: controls_view
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: selected_control
    type: int
    restore_value: no
    initial_value: '-1'
  - id: ha_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_last_connected_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ha_using_demo
    type: bool
    restore_value: no
    initial_value: 'true'

# Do not refresh the e-paper when a value arrives.  This only governs whether
# the renderer uses cached HA states or the per-field DEMO defaults.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(ha_ever_connected) = true;
                id(ha_last_connected_ms) = millis();
                id(ha_using_demo) = false;
          else:
            - lambda: |-
                if (!id(ha_ever_connected) || (uint32_t) (millis() - id(ha_last_connected_ms)) > 60000U) {
                  id(ha_using_demo) = true;
                }
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return !id(controls_view);'
          then:
            - component.update: epaper_display

display:
  - platform: papermono_epaper
    id: epaper_display
    spi_id: spi_epd
    update_interval: never
    full_update_every: 10
    transform:
      mirror_x: true
      mirror_y: false
    rotation: 90
    dimensions:
      width: 800
      height: 480
    cs_pin: GPIO16
    dc_pin: GPIO17
    busy_pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    reset_pin:
      m5ioe1_id: m5ioe1_hub
      number: 4
      mode:
        output: true
    lambda: |-
      const int w = it.get_width();
      const int h = it.get_height();
      it.fill(Color::WHITE);

      if (!id(controls_view)) {
        // DEMO is strictly a global fallback after the API has been absent for
        // 60 seconds. While HA is available, invalid individual fields are
        // rendered as an em dash rather than being presented as demo values.
        const bool use_demo_globally = id(ha_using_demo);
        auto valid = [](float value, float minimum, float maximum) {
          return !std::isnan(value) && value >= minimum && value <= maximum;
        };
        auto available = [&](bool has_state, float value, float minimum, float maximum) {
          return has_state && valid(value, minimum, maximum);
        };
        const bool outdoor_temp_available = available(id(ha_weather_temperature).has_state(), id(ha_weather_temperature).state, -50.0f, 80.0f);
        const bool indoor_temp_available = available(id(ha_indoor_temperature).has_state(), id(ha_indoor_temperature).state, -50.0f, 80.0f);
        const bool humidity_available = available(id(ha_weather_humidity).has_state(), id(ha_weather_humidity).state, 0.0f, 100.0f);
        const bool indoor_humidity_available = available(id(ha_indoor_humidity).has_state(), id(ha_indoor_humidity).state, 0.0f, 100.0f);
        const bool co2_available = available(id(ha_indoor_co2).has_state(), id(ha_indoor_co2).state, 0.0f, 10000.0f);
        const bool pm25_indoor_available = available(id(ha_indoor_pm25).has_state(), id(ha_indoor_pm25).state, 0.0f, 2000.0f);
        const bool pm25_outdoor_available = available(id(ha_outdoor_pm25).has_state(), id(ha_outdoor_pm25).state, 0.0f, 2000.0f);
        const bool voc_available = available(id(ha_indoor_voc).has_state(), id(ha_indoor_voc).state, 0.0f, 10000.0f);
        const bool solar_available = available(id(ha_solar_power).has_state(), id(ha_solar_power).state, 0.0f, 100000.0f);
        const bool house_available = available(id(ha_house_power).has_state(), id(ha_house_power).state, 0.0f, 100000.0f);
        const bool grid_import_available = available(id(ha_grid_import).has_state(), id(ha_grid_import).state, 0.0f, 100000.0f);
        const bool grid_export_available = available(id(ha_grid_export).has_state(), id(ha_grid_export).state, 0.0f, 100000.0f);
        const bool battery_charge_available = available(id(ha_battery_charge).has_state(), id(ha_battery_charge).state, 0.0f, 100000.0f);
        const bool battery_discharge_available = available(id(ha_battery_discharge).has_state(), id(ha_battery_discharge).state, 0.0f, 100000.0f);
        const bool battery_soc_available = available(id(ha_battery_soc).has_state(), id(ha_battery_soc).state, 0.0f, 100.0f);

        const std::string &weather_state = id(ha_weather_state).state;
        const bool weather_available = id(ha_weather_state).has_state() && !weather_state.empty() &&
                                       weather_state != "unknown" && weather_state != "unavailable";
        const char *weather = use_demo_globally ? "SOLEADO" : "—";
        if (!use_demo_globally && weather_available) {
          const std::string &state = id(ha_weather_state).state;
          weather = "TIEMPO";
          if (state == "cloudy" || state == "partlycloudy") weather = "NUBLADO";
          else if (state == "rainy" || state == "pouring") weather = "LLUVIA";
          else if (state == "snowy") weather = "NIEVE";
          else if (state == "fog") weather = "NIEBLA";
          else if (state == "windy") weather = "VIENTO";
          else if (state == "sunny" || state == "clear-night") weather = "SOLEADO";
        }
        char outdoor_temp_text[20], indoor_temp_text[20], humidity_text[24], indoor_humidity_text[24], co2_text[24], pm_indoor_text[28], pm_outdoor_text[28], voc_text[24], weather_detail_text[32];
        char solar_text[20], house_text[20], grid_text[24], battery_text[28], soc_text[20];
        auto power_text = [&](char *buffer, size_t size, bool has_value, float watts) {
          if (!use_demo_globally && !has_value) { strcpy(buffer, "—"); return; }
          if (watts >= 1000.0f) snprintf(buffer, size, "%.1f kW", watts / 1000.0f);
          else snprintf(buffer, size, "%.0f W", watts);
        };
        auto text_or_dash = [&](char *buffer, size_t size, bool has_value, float value, float demo, const char *format) {
          if (!use_demo_globally && !has_value) { strcpy(buffer, "—"); return; }
          snprintf(buffer, size, format, use_demo_globally ? demo : value);
        };
        text_or_dash(outdoor_temp_text, sizeof(outdoor_temp_text), outdoor_temp_available, id(ha_weather_temperature).state, 28.4f, "%.1f C");
        text_or_dash(indoor_temp_text, sizeof(indoor_temp_text), indoor_temp_available, id(ha_indoor_temperature).state, 24.1f, "%.1f C");
        text_or_dash(humidity_text, sizeof(humidity_text), humidity_available, id(ha_weather_humidity).state, 48.0f, "%.0f %% HUMEDAD");
        if (!use_demo_globally && !humidity_available) strcpy(weather_detail_text, "Humedad -");
        else snprintf(weather_detail_text, sizeof(weather_detail_text), "Humedad %.0f %%", use_demo_globally ? 48.0f : id(ha_weather_humidity).state);
        text_or_dash(indoor_humidity_text, sizeof(indoor_humidity_text), indoor_humidity_available, id(ha_indoor_humidity).state, 48.0f, "Humedad %.0f %%");
        text_or_dash(co2_text, sizeof(co2_text), co2_available, id(ha_indoor_co2).state, 612.0f, "CO2 %.0f ppm");
        text_or_dash(pm_indoor_text, sizeof(pm_indoor_text), pm25_indoor_available, id(ha_indoor_pm25).state, 7.0f, "PM2.5 IN %.0f ug/m3");
        text_or_dash(pm_outdoor_text, sizeof(pm_outdoor_text), pm25_outdoor_available, id(ha_outdoor_pm25).state, 12.0f, "PM2.5 OUT %.0f ug/m3");
        text_or_dash(voc_text, sizeof(voc_text), voc_available, id(ha_indoor_voc).state, 82.0f, "VOC %.0f");
        power_text(solar_text, sizeof(solar_text), solar_available, use_demo_globally ? 3200.0f : id(ha_solar_power).state);
        power_text(house_text, sizeof(house_text), house_available, use_demo_globally ? 1100.0f : id(ha_house_power).state);
        const bool grid_available = grid_import_available || grid_export_available;
        const bool use_grid_import = use_demo_globally ? false : grid_import_available &&
                                     (id(ha_grid_import).state > 0.0f || !grid_export_available);
        power_text(grid_text, sizeof(grid_text), grid_available, use_demo_globally ? 2100.0f : (use_grid_import ? id(ha_grid_import).state : id(ha_grid_export).state));
        const bool battery_available = battery_charge_available || battery_discharge_available;
        const bool use_battery_charge = !use_demo_globally && battery_charge_available &&
                                        (id(ha_battery_charge).state > 0.0f || !battery_discharge_available);
        power_text(battery_text, sizeof(battery_text), battery_available, use_demo_globally ? 700.0f : (use_battery_charge ? id(ha_battery_charge).state : id(ha_battery_discharge).state));
        text_or_dash(soc_text, sizeof(soc_text), battery_soc_available, id(ha_battery_soc).state, 76.0f, "SOC %.0f %%");

        // Screensaver: sparse vertical panel, with no per-value cards.
        it.print(28, 24, id(font_time), Color::BLACK, "18:30");
        // Simple moon mark drawn from circles; no Unicode icon/font dependency.
        it.filled_circle(426, 54, 17, Color::BLACK);
        it.filled_circle(434, 47, 17, Color::WHITE);
        it.print(32, 104, id(font_body), Color::BLACK, "JUEVES 27 AGOSTO");
        it.line(28, 140, w - 28, 140, Color::BLACK);

        it.print(32, 168, id(font_body), Color::BLACK, "EXTERIOR");
        it.print(32, 198, id(font_title), Color::BLACK, outdoor_temp_text);
        it.print(32, 258, id(font_body), Color::BLACK, weather);
        it.print(32, 292, id(font_body), Color::BLACK, weather_detail_text);
        it.print(32, 320, id(font_body), Color::BLACK, pm_outdoor_text);

        it.line(28, 350, w - 28, 350, Color::BLACK);
        it.print(32, 374, id(font_body), Color::BLACK, "INTERIOR");
        it.print(32, 402, id(font_title), Color::BLACK, indoor_temp_text);
        it.print(260, 408, id(font_body), Color::BLACK, indoor_humidity_text);
        it.print(32, 454, id(font_body), Color::BLACK, co2_text);
        it.print(32, 482, id(font_body), Color::BLACK, pm_indoor_text);
        it.print(260, 482, id(font_body), Color::BLACK, voc_text);

        it.line(28, 520, w - 28, 520, Color::BLACK);
        it.print(32, 544, id(font_body), Color::BLACK, "ENERGIA");
        it.print(48, 580, id(font_body), Color::BLACK, "SOL");
        it.print(48, 610, id(font_body), Color::BLACK, solar_text);
        it.line(92, 636, 92, 660, Color::BLACK);
        it.line(92, 660, 86, 652, Color::BLACK);
        it.line(92, 660, 98, 652, Color::BLACK);
        it.print(48, 674, id(font_body), Color::BLACK, "CASA");
        it.print(48, 704, id(font_body), Color::BLACK, house_text);

        it.print(260, 580, id(font_body), Color::BLACK, use_grid_import ? "RED ->" : (grid_available ? "RED <-" : "RED"));
        it.print(260, 610, id(font_body), Color::BLACK, grid_text);
        it.print(260, 674, id(font_body), Color::BLACK, use_battery_charge ? "BAT +" : (battery_available ? "BAT -" : "BAT"));
        it.print(260, 704, id(font_body), Color::BLACK, battery_text);
        it.print(360, 704, id(font_body), Color::BLACK, soc_text);

        it.line(28, 748, w - 28, 748, Color::BLACK);
        it.print(88, 768, id(font_body), Color::BLACK, "TOCA PARA CONTROLES");
        if (use_demo_globally)
          it.print(w - 92, 32, id(font_body), Color::BLACK, "DEMO");
      } else {
        // Controls: four large, one-handed targets plus a persistent back area.
        it.print(28, 30, id(font_title), Color::BLACK, "CONTROLES");
        it.print(325, 48, id(font_body), Color::BLACK, "PAPERMONO");
        it.line(28, 100, w - 28, 100, Color::BLACK);

        auto draw_control = [&](int x, int y, const char *label, const char *icon, int index) {
          const bool selected = id(selected_control) == index;
          if (selected) {
            it.filled_rectangle(x, y, 205, 210, Color::BLACK);
            it.print(x + 22, y + 30, id(font_title), Color::WHITE, icon);
            it.print(x + 22, y + 135, id(font_body), Color::WHITE, label);
          } else {
            it.rectangle(x, y, 205, 210, Color::BLACK);
            it.print(x + 22, y + 30, id(font_title), Color::BLACK, icon);
            it.print(x + 22, y + 135, id(font_body), Color::BLACK, label);
          }
        };

        draw_control(28, 135, "CLIMA", "~", 0);
        draw_control(247, 135, "LUCES", "*", 1);
        draw_control(28, 375, "PERSIANAS", "=", 2);
        draw_control(247, 375, "ROBOT", "+", 3);

        it.filled_rectangle(28, 660, w - 56, 82, Color::BLACK);
        it.print(150, 685, id(font_body), Color::WHITE, "VOLVER");
        if (id(selected_control) >= 0)
          it.print(28, 758, id(font_body), Color::BLACK, "SELECCIONADO");
      }

touchscreen:
  - platform: ft63x6
    id: touch_panel
    i2c_id: bus_main
    display: epaper_display
    update_interval: 50ms
    interrupt_pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    reset_pin:
      m5ioe1_id: m5ioe1_hub
      number: 5
      mode:
        output: true
    calibration:
      x_min: 5
      x_max: 475
      y_min: 5
      y_max: 795
    on_touch:
      - lambda: |-
          const int x = touch.x;
          const int y = touch.y;
          static const int CARD_X[] = {28, 247, 28, 247};
          static const int CARD_Y[] = {135, 135, 375, 375};
          const int CARD_W = 205;
          const int CARD_H = 210;

          if (!id(controls_view)) {
            id(controls_view) = true;
            id(selected_control) = -1;
            ESP_LOGI("control", "screensaver -> controls");
            id(epaper_display).update_partial(0, 0, 480, 800);
            return;
          }
          if (y >= 660) {
            id(controls_view) = false;
            id(selected_control) = -1;
            ESP_LOGI("control", "controls -> screensaver");
            id(epaper_display).update_partial(0, 0, 480, 800);
            return;
          }

          int pressed = -1;
          if (x >= 28 && x < 233 && y >= 135 && y < 345) {
            pressed = 0;
            ESP_LOGI("control", "pressed Climate");
          } else if (x >= 247 && x < 452 && y >= 135 && y < 345) {
            pressed = 1;
            ESP_LOGI("control", "pressed Lights");
          } else if (x >= 28 && x < 233 && y >= 375 && y < 585) {
            pressed = 2;
            ESP_LOGI("control", "pressed Blinds");
          } else if (x >= 247 && x < 452 && y >= 375 && y < 585) {
            pressed = 3;
            ESP_LOGI("control", "pressed Robot");
          }
          if (pressed < 0)
            return;

          const int previous = id(selected_control);
          if (pressed == previous)
            return;

          id(selected_control) = pressed;
          if (previous >= 0) {
            id(epaper_display).add_partial_region(CARD_X[previous], CARD_Y[previous], CARD_W, CARD_H);
          } else {
            id(epaper_display).add_partial_region(28, 750, 250, 50);
          }
          id(epaper_display).add_partial_region(CARD_X[pressed], CARD_Y[pressed], CARD_W, CARD_H);
          id(epaper_display).update_partial();
      - logger.log:
          format: "Touch down x=%d y=%d raw_x=%d raw_y=%d id=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw, touch.id]
    on_release:
      - logger.log:
          format: "Touch released"
